<head>

<title>מאגר שאלות — מבחן הסקיפר</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Heebo', 'Segoe UI', Arial, sans-serif; background: #0c1a3a; color: #e8f0fe; min-height: 100vh; }

  header { background: #081228; padding: 20px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #7eb8f7; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 22px; color: #7eb8f7; font-weight: 800; }
  header .stats { margin-right: auto; font-size: 13px; color: #aac4e8; }

  .controls { background: #112040; padding: 14px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #1e3a6a; }
  .search { flex: 1; min-width: 200px; padding: 9px 14px; border-radius: 8px; border: 1px solid #2a4a80; background: #0c1a3a; color: #e8f0fe; font-size: 15px; direction: rtl; }
  .search:focus { outline: none; border-color: #7eb8f7; }
  .search::placeholder { color: #556688; }
  .filter-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid #2a4a80; background: transparent; color: #aac4e8; cursor: pointer; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
  .filter-btn:hover, .filter-btn.active { background: #7eb8f7; color: #0c1a3a; border-color: #7eb8f7; font-weight: 700; }

  main { padding: 20px 24px; max-width: 960px; margin: 0 auto; }

  .category { margin-bottom: 20px; background: #112040; border-radius: 12px; overflow: hidden; border: 1px solid #1e3a6a; }
  .cat-header { padding: 14px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; user-select: none; transition: background 0.2s; }
  .cat-header:hover { background: #162a54; }
  .cat-title { font-size: 17px; font-weight: 700; color: #7eb8f7; }
  .cat-count { font-size: 13px; color: #aac4e8; background: #0c1a3a; padding: 2px 10px; border-radius: 12px; }
  .cat-arrow { margin-right: auto; color: #7eb8f7; font-size: 18px; transition: transform 0.25s; }
  .category.collapsed .cat-arrow { transform: rotate(-90deg); }
  .cat-body { display: grid; gap: 0; }
  .category.collapsed .cat-body { display: none; }

  .q-card { padding: 18px 20px; border-top: 1px solid #1e3a6a; transition: background 0.15s; }
  .q-card:hover { background: #0f1e3c; }
  .q-num { font-size: 11px; color: #556688; margin-bottom: 6px; }
  .q-text { font-size: 15px; font-weight: 600; color: #dde8ff; margin-bottom: 12px; line-height: 1.5; }
  .options { display: grid; gap: 6px; }
  .opt { padding: 8px 12px; border-radius: 7px; font-size: 14px; color: #aac4e8; background: #0c1a3a; border: 1px solid #1e3a6a; line-height: 1.4; }
  .opt.correct { background: #0d2e1a; border-color: #2ecc71; color: #a0f0b8; font-weight: 700; }
  .opt.correct::after { content: " ✓"; }
  .explanation { margin-top: 10px; padding: 10px 14px; background: #0a1a33; border-right: 3px solid #7eb8f7; border-radius: 0 7px 7px 0; font-size: 13px; color: #8aafd4; line-height: 1.55; }

  .no-results { text-align: center; padding: 60px; color: #556688; font-size: 16px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0c1a3a; }
  ::-webkit-scrollbar-thumb { background: #2a4a80; border-radius: 3px; }

  .load-bar { text-align: center; padding: 40px; color: #7eb8f7; }

  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap');
</style>
</head>
<body>

<header>
  <span style="font-size:28px">⚓</span>

  <button class="filter-btn active" onclick="setTopic('all',this)">הכל</button>
  <div id="topicBtns"></div>
</div>

<main id="main">

  {"num":42,"topic":"זכות מעבר","q_he":"שתי ספינות מפרש מתקרבות זו לזו. לאחת רוח מימין (Starboard) ולשנייה רוח משמאל (Port). מי נותן זכות מעבר?","options":["א. הספינה עם הרוח מ-Starboard נותנת זכות מעבר","ב. הספינה עם הרוח מ-Port נותנת זכות מעבר","ג. הספינה הגדולה יותר נותנת זכות מעבר","ד. שתיהן מאטות ומתקשרות ברדיו"],"answer":"ב","explanation":"COLREGS Rule 12: ספינת מפרש עם רוח מ-Port מפנה לספינה עם רוח מ-Starboard."},

  {"num":95,"topic":"עגינה","q_he":"כמה שרשרת עוגן צריך לשחרר לעגינה בטוחה?","options":["א. שרשרת באורך שווה לעומק המים","ב. שרשרת באורך פי 3 מעומק המים","ג. שרשרת באורך פי 5 עד 7 מעומק המים","ד. שרשרת באורך פי 10 מעומק המים"],"answer":"ג","explanation":"היחס הנכון הוא 5:1 עד 7:1 — פי 5 עד 7 מעומק המים. פחות מזה — העוגן עלול לגרור."},
  {"num":101,"topic":"ניווט","q_he":"מדוע חולקה מעטפת כדור הארץ לקוי אורך ורוחב?","options":["א. כדי להגדיר אתרים בנקודות החיתוך שלהם","ב. כדי להדגיש את מקום הנמלים והמעגנות","ג. כדי לאפשר מדידת מרחקים","ד. כדי ליצור משבצות לציור מפות"],"answer":"א","explanation":"קווי האורך והרוחב מגדירים נקודות חיתוך ייחודיות — כל נקודה בעולם מוגדרת ע\"י קו רוחב + קו אורך."},
  {"num":102,"topic":"ניווט","q_he":"מדוע רואים את השמש זורחת במזרח ושוקעת במערב?","options":["א. כדור הארץ נע במהירות מערבה סביב השמש","ב. כדור הארץ סובב סביב צירו ממערב למזרח","ג. ציר רוחבי של כדור הארץ מבצע תנועה מעגלית סביב כוכב הצפון","ד. כדור הארץ סובב סביב צירו ממזרח למערב"],"answer":"ב","explanation":"כדור הארץ מסתובב ממערב למזרח — לכן השמש נראית זורחת במזרח ושוקעת במערב."},
  {"num":103,"topic":"ניווט","q_he":"מה מסיק כלי שיט שמודד בכל ערב את אותה זווית מעל האופק לכוכב הצפון?","options":["א. שהוא שט בחפיפה לקו רוחב קבוע","ב. שהוא שט ממערב למזרח או ממזרח למערב","ג. שהוא שט מדרום לצפון או מצפון לדרום","ד. א ו-ב נכונות"],"answer":"א","explanation":"גובה כוכב הצפון מעל האופק שווה לקו הרוחב. אם הזווית קבועה — כלי השיט שט על אותו קו רוחב."},

  {"num":112,"topic":"ניווט","q_he":"מכלי שיט שאורכו 15 מטרים מושלך בחרטום חפץ שצף, חולפות 5 שניות עד הגעתו לירכתיים. מה מהירות כלי השיט?","options":["א. 3 קשרים","ב. 1.853 קשרים","ג. 6 קשרים בקרוב","ד. 5.83 קשרים בדיוק"],"answer":"ד","explanation":"מהירות = 15מ / 5ש = 3 מ\"ש. 3 × 3600 / 1852 = 5.83 קשרים."},

  {"num":117,"topic":"ניווט","q_he":"מהו מרחק האופק של צופה בגובה 9 מטרים?","options":["א. כ-9.6 מיל","ב. כ-6.3 מיל","ג. כ-3 מיל","ד. כ-2.1 מיל"],"answer":"ב","explanation":"נוסחה: מרחק אופק (מיל) = 2.03 × √גובה(מטר). 2.03 × √9 = 2.03 × 3 ≈ 6.1 מיל."},

  {"num":119,"topic":"ניווט","q_he":"קו אורך גרינוויץ הוא:","options":["א. קו אורך ראשוני שממנו מונים את ערכם של קוי האורך מזרחה ומערבה","ב. קו אורך שעובר בעיירה קטנה ליד לונדון ששמה גרינוויץ","ג. חצי ממעגל גדול שחציו השני הוא קו אורך 180°","ד. כל התשובות נכונות"],"answer":"ד","explanation":"כל התשובות נכונות: קו אורך 0° — הקו הראשוני, עובר בגרינוויץ ליד לונדון, וחצי מהמעגל הגדול."},
  {"num":120,"topic":"ניווט","q_he":"אתה על קו אורך 179°31'E, השעה 23:59 ב-31 דצמבר. מה השעה והתאריך ב-179°31'W?","options":["א. 22:59 ב-30 בדצמבר","ב. 23:59 ב-30 בדצמבר","ג. 23:59 ב-1 בינואר","ד. אותה שעה ואותו תאריך"],"answer":"ב","explanation":"179°E ≈ UTC+12; 179°W ≈ UTC-12. הפרש = 24 שעות. אז ב-179°W = 23:59 ב-30 בדצמבר."},

  {"num":122,"topic":"מצפן","q_he":"על אלו מצפנים משפיעה הווראציה באותה מידה?","options":["א. מצפן מגנטי ומצפן Flux Gate","ב. מצפן סביבוני (Gyroscopic) ומצפן אזימוט","ג. מצפנים שלא בוצעה טבלת דוויאציה ביחס אליהם","ד. מצפנים בכלי שיט שאינם בנויים ממתכת"],"answer":"א","explanation":"ווראציה (ההפרש בין צפון מגנטי לגיאוגרפי) משפיעה על כל מצפן שמבוסס על השדה המגנטי של כדור הארץ."},
  {"num":123,"topic":"ניווט","q_he":"מה מראה מד הרוח שבספינה בעת הפלגה?","options":["א. רוח אמיתית","ב. רוח פנים","ג. רוח יחסית (מדומה)","ד. רוח גבית"],"answer":"ג","explanation":"בעת הפלגה, מד הרוח מודד את הרוח היחסית (apparent wind) — שילוב של הרוח האמיתית ורוח ההפלגה."},
  {"num":124,"topic":"הגה אוטומטי","q_he":"מהו יתרונו העיקרי של הגה אוטומטי?","options":["א. מאפשר השטת הספינה בצוות חסר","ב. משחרר מחובת תצפית","ג. מאפשר משמרות ים נוחות יותר והתמקדות בתצפית וטיפולים דחופים","ד. מאפשר פנוי דרך אוטומטי כשיש אזעקת טווח מהמכ\"מ"],"answer":"ג","explanation":"ההגה האוטומטי משחרר ידיים לתצפית ופעולות דחופות — אך אינו פוטר מחובת תצפית (COLREGS Rule 5)."},
  {"num":125,"topic":"מצפן","q_he":"מה נדרש כדי להכין טבלת דוויאציה למצפנים מגנטיים?","options":["א. לזהות במדויק שני אתרים על קו אחד בתצפית ובמפה","ב. לסובב את כלי השיט 360° עם המצפן הנבדק ולרשום קריאות","ג. לשוט הלוך וחזור בין שני מצופים ולרשום כיוון לאתר קבוע כל 4 דקות","ד. א ו-ב נכונות"],"answer":"ד","explanation":"הכנת טבלת דוויאציה דורשת: זיהוי אתרים ידועים (קו בינוי) + סיבוב 360° לרישום הדוויאציה בכל כיוון."},
  {"num":126,"topic":"הגה אוטומטי","q_he":"מה הם חסרונותיו העיקריים של הגה אוטומטי חשמלי?","options":["א. צורך חשמל ברציפות והמכלול דורש אחזקה וצפוי לתקלות","ב. עלול לגרום לירידה בערנות תצפית","ג. אינו מגיב לשנויים ברוח בשיט מפרשים","ד. כל התשובות נכונות"],"answer":"ד","explanation":"הגה אוטומטי חשמלי: צורך חשמל, עלול להפחית ערנות, ודורש אחזקה — כל התשובות נכונות."},

  {"num":128,"topic":"מד עומק","q_he":"מהם שימושי מד עומק הדי (ECHO SOUNDER)?","options":["א. בטיחות השיט, ניווט, ניתוב, עגינה","ב. דייג, מיפוי ולוחמה ימית","ג. זיהוי מכשולים תת-ימיים, זיהוי כניסה למעגנות","ד. כל התשובות נכונות"],"answer":"א","explanation":"ברכב שיט פנאי, מד העומק משמש לבטיחות השיט, ניווט, ניתוב מצועות רדודות ועגינה בטוחה."},

  {"num":130,"topic":"מד עומק","q_he":"בזמן השייט נמדד במד עומק 12 מטרים, אך במפה מצוין 10 מטרים. שוקע הספינה 1.2 מטרים. מדוע?","options":["א. אורך הפולס אינו מאפשר רמת דיוק כזו","ב. ישנם גלים בגובה ממוצע של 1.2 מטר","ג. העומק במפה מצוין בשיא השפל ובזמן המדידה יש גאות","ד. העומק במפה מצוין בשיא הגאות אם הממיר מותקן בקו המים"],"answer":"ג","explanation":"עומקי מפה ניתנים בשפל נמוך. גאות מוסיפה מים. הפרש בין הנמדד למפה = גאות קיימת."},
  {"num":131,"topic":"מד עומק","q_he":"מה יהיה העומק שיופיע במפה כאשר מד העומק מראה 10 מטרים, שוקע 2 מטרים, גאות 1 מטר?","options":["א. 13 מטרים","ב. 10 מטרים","ג. 9 מטרים","ד. 11 מטרים"],"answer":"ג","explanation":"עומק מפה (בשפל) = עומק נמדד - גאות = 10 - 1 = 9 מטרים."},

  {"num":133,"topic":"GPS","q_he":"מה ההבדל בין פקד MOB לפקד MARK ב-GPS?","options":["א. אין הבדל — שניהם מסמנים את האתר הנוכחי כנקודת דרך","ב. MOB מסמן את האתר כנקודת דרך פעילה עם כיוון וטווח ברצף; MARK רק מסמן","ג. MARK מסמן את האתר הנוכחי והכיוון ההפוך ב-180°","ד. MARK מפעיל אזהרת טווח; MOB מפעיל מצב עגינה"],"answer":"ב","explanation":"MOB (Man Over Board) = נקודת דרך פעילה שמציגה ברצף כיוון וטווח — קריטי להציל אדם שנפל לים."},

  {"num":135,"topic":"מכ\"מ","q_he":"מהם שימושי המכ\"מ?","options":["א. לזהות קיום כלי שיט ועצמים בטווח נבחר כשאין ראות","ב. למניעת התנגשות, לנווט, לניתוב, לחיפוש והצלה","ג. לזהות קיום כלי שיט ועצמים ולהפעיל אזהרה בטווח קטן","ד. כל התשובות נכונות"],"answer":"ד","explanation":"מכ\"מ ימי: זיהוי עצמים וכלי שיט בכל תנאי ראות, מניעת התנגשות, ניווט, ניתוב, וחיפוש והצלה."},

  {"num":139,"topic":"מכ\"מ","q_he":"מה מצב STAND-BY במכ\"מ הימי?","options":["א. המכ\"מ רק קולט ואינו משדר","ב. המכ\"מ בפעולה מלאה אך התצוגה כבויה","ג. כל הפקדים מכוונים למצב התחלתי","ד. המכ\"מ אינו משדר או קולט אך המסך חם ומוכן לפעולה מיידית"],"answer":"ד","explanation":"STAND-BY: המכ\"מ חמום ומוכן לפעולה מיידית אך לא משדר — חוסך בחשמל ומפחית קרינה."},
  {"num":140,"topic":"קשר VHF","q_he":"מהו ה-MMSI של כלי שייט?","options":["א. מספר בן 9 ספרות לקריאת ברירה ספרתית ומזהה לאום וסוג תחנה","ב. מספר קו המאפשר ברירה של הודעות הנוגעות לכלי השיט","ג. חייב להופיע במסמכי כלי השיט ולהיות זמין להקראה","ד. כל התשובות נכונות"],"answer":"ד","explanation":"MMSI (Maritime Mobile Service Identity) = 9 ספרות ייחודיות לכלי שיט, משמש ל-DSC, AIS, ומזהה מדינה."},

  {"num":142,"topic":"קשר VHF","q_he":"מה תפקידו של פקד DUAL WATCH?","options":["א. האזנה על ערוץ נבחר אך שדור רק על ערוץ 16","ב. האזנה ושידור על ערוץ נבחר, עם פריצה לערוץ 16 כשיש הודעות","ג. משמרת כפולה — ליד המכשיר וליד ההגאי","ד. משמרת כפולה — DSC וגם קשר דבור"],"answer":"ב","explanation":"DUAL WATCH = האזנה סימולטנית על ערוץ 16 (חירום) ועוד ערוץ עבודה. כשיש שידור על 16 — עובר אוטומטית."},

const TOPIC_ICONS = {
  "ניווט": "🧭", "מצפן": "🔵", "GPS": "📡", "מד עומק": "🌊",
  "הגה אוטומטי": "⚙️", "קשר VHF": "📻", "מכ\"מ": "📺",
  "ציוד הצלה": "🆘", "זכות מעבר": "⚓", "אורות ניווט": "💡",
  "כניסה לנמל": "🚢", "אותות מצוקה": "🔴", "עגינה": "⚓"
};

let activeTopic = 'all';
let searchTerm = '';

function buildTopicButtons() {
  const topics = [...new Set(ALL_QUESTIONS.map(q => q.topic))].sort();
  const el = document.getElementById('topicBtns');
  el.innerHTML = topics.map(t =>
    `<button class="filter-btn" onclick="setTopic('${t}',this)">${TOPIC_ICONS[t]||'📌'} ${t}</button>`
  ).join('');
}

function setTopic(t, btn) {
  activeTopic = t;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filter() {
  searchTerm = document.getElementById('search').value.trim().toLowerCase();
  render();
}

function getFiltered() {
  return ALL_QUESTIONS.filter(q => {
    const topicOk = activeTopic === 'all' || q.topic === activeTopic;
    if (!topicOk) return false;
    if (!searchTerm) return true;
    return q.q_he.toLowerCase().includes(searchTerm) ||
           q.options.some(o => o.toLowerCase().includes(searchTerm)) ||
           (q.explanation||'').toLowerCase().includes(searchTerm);
  });
}

function render() {
  const qs = getFiltered();
  document.getElementById('stats').textContent = `${qs.length} שאלות | ${[...new Set(ALL_QUESTIONS.map(q=>q.topic))].length} קטגוריות`;

  const main = document.getElementById('main');
  if (!qs.length) {
    main.innerHTML = '<div class="no-results">🔍 לא נמצאו שאלות</div>';
    return;
  }

  // Group by topic
  const grouped = {};
  qs.forEach(q => {
    if (!grouped[q.topic]) grouped[q.topic] = [];
    grouped[q.topic].push(q);
  });

  main.innerHTML = Object.entries(grouped).map(([topic, questions]) => `
    <div class="category" id="cat-${topic}">
      <div class="cat-header" onclick="toggleCat('cat-${topic}')">
        <span style="font-size:22px">${TOPIC_ICONS[topic]||'📌'}</span>
        <span class="cat-title">${topic}</span>
        <span class="cat-count">${questions.length} שאלות</span>
        <span class="cat-arrow">▾</span>
      </div>
      <div class="cat-body">
        ${questions.map(q => renderQ(q)).join('')}
      </div>
    </div>
  `).join('');
}

function renderQ(q) {
  const ansIdx = ['א','ב','ג','ד'].indexOf(q.answer);
  return `
    <div class="q-card">
      <div class="q-num">#${q.num}</div>
      <div class="q-text">${q.q_he}</div>
      <div class="options">
        ${q.options.map((opt, i) => `<div class="opt${i === ansIdx ? ' correct' : ''}">${opt}</div>`).join('')}
      </div>
      ${q.explanation ? `<div class="explanation">💡 ${q.explanation}</div>` : ''}
    </div>`;
}

function toggleCat(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

// Init
buildTopicButtons();
render();
</script>
