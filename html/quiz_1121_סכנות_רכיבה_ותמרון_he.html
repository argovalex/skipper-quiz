<!DOCTYPE html>
<html dir="rtl" lang="he"><head><meta charset="UTF-8">
<title>Skipper Quiz #1121 — סכנות רכיבה ותמרון</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
#reel{width:390px;height:625px;background:#0c1a3a;overflow:hidden;position:relative;display:flex;flex-direction:column;font-family:'Heebo',sans-serif;direction:rtl}
#hdr{background:#0c1a3a;padding:14px 16px 10px;flex-shrink:0;border-bottom:2px solid #1e3a6e;text-align:center}
.brand{color:#7eb8f7;font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:2px}
.htitle{color:#fff;font-size:18px;font-weight:900}
#scene{flex:1;position:relative;overflow:hidden}
#ftr{background:#0c1a3a;padding:12px 16px;flex-shrink:0;border-top:2px solid #1e3a6e}
.ql{color:#7eb8f7;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:5px}
.qt{color:#fff;font-size:13px;font-weight:700;line-height:1.4;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{background:#1a2f5e;border:1px solid #2a4a8a;border-radius:7px;padding:7px 10px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;transition:all 0.5s}
.ltr{background:#0c1a3a;color:#7eb8f7;font-size:11px;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900}
.opt.correct{background:#0d3d2a;border-color:#2ecc71;color:#2ecc71}
.opt.correct .ltr{background:#2ecc71;color:#0d3d2a}
.opt.wrong{background:#3d1a1a;border-color:#e74c3c;color:#e74c3c}
.opt.wrong .ltr{background:#e74c3c;color:#fff}
.opt.dim{opacity:0.3}
#prog{position:absolute;bottom:0;left:0;height:2px;background:#4a90d9;width:0;z-index:5}
</style></head><body>
<div id="reel">
  <div id="hdr"><div class="brand">⚓ SKIPPER QUIZ</div><div class="htitle">מבחן הסקיפר היומי של אלכס ארגוב</div></div>
  <div id="scene">
    
    <svg width="100%" height="100%" viewBox="0 0 360 420" preserveAspectRatio="xMidYMid slice" style="">
      
  <rect width="360" height="420" fill="#0a1428"/>
  <rect x="0" y="292" width="360" height="128" fill="#1a5276"/>
  <text x="180" y="116" text-anchor="middle" fill="#fff" font-size="16" font-family="Heebo,sans-serif" font-weight="900">המדומם ניתלש - פגיעה מההגה</text>

  <!-- speed lines behind, then a sudden stop -->
  <g stroke="#7eb8f7" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M62 244 L104 244"/><path d="M56 262 L102 262"/><path d="M66 280 L108 280"/>
  </g>
  <text x="86" y="228" text-anchor="middle" fill="#7eb8f7" font-size="11" font-family="Heebo,sans-serif" font-weight="700">עצירה פתאומית</text>

  
  <g>
  <!-- Stern boarding platform -->
  <path d="M116.75,282.75 L133,280.25 L133,287.75 L119.25,286.5 Z" fill="#c8a000" opacity=".85"/>
  <!-- Hull: deck line aft, rising to a tall bow, keel sweeping up at both ends -->
  <path d="M130.5,274 L230.5,274 Q246.75,272.75 250.5,267.75
           Q251.75,280.25 241.75,287.75 Q220.5,294 180.5,294
           Q148,294 135.5,287.75 Z"
        fill="#f1c40f" stroke="#c8a000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Waterline shading on the submerged part -->
  <path d="M134.25,284 L245.5,284 Q220.5,294 180.5,294 Q148,294 135.5,287.75 Z"
        fill="#c8a000" opacity=".45"/>
  <!-- Rubbing strake along the hull -->
  <path d="M131.75,279 L243,277.75" stroke="#c8a000" stroke-width="1.875" opacity=".8"/>
  <!-- Saddle: long, from the stern deck forward to the console -->
  <path d="M138,274 Q138,265.25 145.5,261.5 Q160.5,257.75 178,259
           Q191.75,260.25 200.5,266.5 L203,274 Z"
        fill="#2c3e50" stroke="#1a2530" stroke-width="1.625" stroke-linejoin="round"/>
  <!-- Front hood / storage, ahead of the rider, sloping to the bow -->
  <path d="M200.5,266.5 L203,257.75 Q213,255.25 225.5,257.75 Q239.25,260.25 246.75,269
           L245.5,272.75 Q225.5,270.25 201.75,269 Z"
        fill="#f1c40f" stroke="#c8a000" stroke-width="1.75" stroke-linejoin="round"/>
  <path d="M225.5,259 Q238,261.5 244.25,267.75" fill="none" stroke="#fff" stroke-width="2" opacity=".35"/>
  <!-- Handlebars, sitting just aft of the hood -->
  <path d="M201.75,251.5 L201.75,262.75" stroke="#2c3e50" stroke-width="3"/>
  <path d="M193,251.5 L209.25,250.25" stroke="#2c3e50" stroke-width="3.75" stroke-linecap="round"/>
  <circle cx="191.75" cy="251.5" r="3.25" fill="#1a2530"/>
  <circle cx="210.5" cy="250.25" r="3.25" fill="#1a2530"/>
  <!-- Jet nozzle -->
  <rect x="125.5" y="276.5" width="8.75" height="8.75" rx="1.875" fill="#7f8c8d"/>
  </g>

  <!-- the driver pitched forward, head/chest into the handlebar in front of him -->
  <g>
    <path d="M180 266 L168 282 L156 288" fill="none" stroke="#1f2f3f" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <path d="M180 266 L197 247" fill="none" stroke="#2980b9" stroke-width="14" stroke-linecap="round"/>
    <path d="M178 262 L193 246" fill="none" stroke="#f4d03f" stroke-width="8" stroke-linecap="round" opacity=".9"/>
    <path d="M180 266 L190 281 L184 292" fill="none" stroke="#2c3e50" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M197 247 L210 254" fill="none" stroke="#2980b9" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="203" cy="245" r="8" fill="#f5cba7"/>
    <path d="M195 244 A8 8 0 0 1 211 244 L211 241 L195 241 Z" fill="#2980b9"/>
  </g>

  <!-- impact burst where the driver meets the handlebar -->
  <g transform="translate(210,250)"><path d="M0,-12 L3,-3 L12,-3 L4,3 L8,12 L0,5 L-8,12 L-4,3 L-12,-3 L-3,-3 Z" fill="#e74c3c" stroke="#f39c12" stroke-width="1"/></g>

  <!-- torn-off kill-switch lanyard flying free -->
  <path d="M224 236 q12 -6 20 0 q7 5 2 13" fill="none" stroke="#e74c3c" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="246" cy="252" r="4.5" fill="none" stroke="#e74c3c" stroke-width="2.6"/>
  <text x="256" y="230" text-anchor="middle" fill="#e74c3c" font-size="11" font-family="Heebo,sans-serif" font-weight="700">המדומם ניתלש</text>

  <text x="180" y="322" text-anchor="middle" fill="#e74c3c" font-size="13.5" font-family="Heebo,sans-serif" font-weight="900">הנוהג נזרק קדימה ונפגע מההגה</text>

      <g id="ov" opacity="0">
        <rect x="60" y="8" width="240" height="38" rx="19" fill="#0d3d2a" stroke="#2ecc71" stroke-width="2" opacity="0.95"/>
        <text id="ovText" x="180" y="32" text-anchor="middle" fill="#2ecc71" font-size="20" font-family="Heebo,sans-serif" font-weight="900">✅ נכון!</text>
      </g>
      <text x="180" y="345" text-anchor="middle" fill="#7eb8f7" font-size="12" font-family="Heebo,sans-serif" font-weight="700" opacity="1">⚓ Alex Argov | Sailing Instructor</text>
    </svg>
    <div id="prog"></div>
  </div>
  <div id="ftr">
    <div class="ql" id="ql">❓ השאלה</div>
    <div class="qt" id="qt">במהירות הפלגה גבוהה מאוד של אופנוע ים כאשר המדומם ניתלש ממקומו, מי יהיה נתון לסכנת פגיעה גדולה יותר?</div>
    <div class="opts" id="opts"><div class="opt" id="o0"><div class="ltr">א</div>הנוהג יפגע מההגה של האופנוע.</div><div class="opt" id="o1"><div class="ltr">ב</div>הנוסע היושב מאחור יחליק לאחור.</div><div class="opt" id="o2"><div class="ltr">ג</div>הנוהג יפול על הנוסע.</div><div class="opt" id="o3"><div class="ltr">ד</div>שניהם נתונים לאותה מידה של סכנה.</div></div>
  </div>
</div>
<script>
const C=0;
const OPTS=["א. הנוהג יפגע מההגה של האופנוע.","ב. הנוסע היושב מאחור יחליק לאחור.","ג. הנוהג יפול על הנוסע.","ד. שניהם נתונים לאותה מידה של סכנה."];
const Q="במהירות הפלגה גבוהה מאוד של אופנוע ים כאשר המדומם ניתלש ממקומו, מי יהיה נתון לסכנת פגיעה גדולה יותר?";
const E="כשהמדומם ניתלש במהירות גבוהה, הנוהג עלול להיפגע מההגה שמול פניו.";
const LT=["א","ב","ג","ד"];

// AUTO-PLAY MODE — countdown then reveal (for screen recording)
// Gated behind window.__startAutoPlay() instead of running on page load, so the
// recorder (Puppeteer) can fire it the instant the screencast actually starts —
// otherwise the timer head-starts before recording begins and drifts out of sync
// with the audio track (which assumes recording-start == t=0).
window.__startAutoPlay = function(){
const prog=document.getElementById('prog');
const DELAY=15000;
prog.style.transition='none';prog.style.width='0%';
setTimeout(()=>{prog.style.transition='width '+DELAY+'ms linear';prog.style.width='100%';},30);
setTimeout(()=>{
  document.querySelectorAll('.opt').forEach((o,j)=>{
    o.style.transition='all 0.6s';
    if(j===C)o.classList.add('correct'); else o.classList.add('dim');
  });
  const ov=document.getElementById('ov');
  const txt=document.getElementById('ovText');
  const rect=ov.querySelector('rect');
  txt.textContent='✅ תשובה נכונה!';txt.setAttribute('fill','#2ecc71');
  rect.setAttribute('fill','#0d3d2a');rect.setAttribute('stroke','#2ecc71');
  ov.setAttribute('opacity','1');
  setTimeout(()=>{
    document.getElementById('ql').textContent='✅ התשובה הנכונה:';
    document.getElementById('qt').innerHTML='<span style="color:#2ecc71;font-size:11px;font-weight:900">'+OPTS[C]+'</span>'+(E?'<br><span style="color:#aac4e8;font-size:10px;font-weight:400">'+E+'</span>':'');
    // Second countdown — next card (loop for batch recording)
    const prog2=document.getElementById('prog');
    prog2.style.transition='none';prog2.style.width='0%';
    setTimeout(()=>{prog2.style.transition='width 4000ms linear';prog2.style.width='100%';},30);
  },600);
},DELAY+50);
};


</script></body></html>
