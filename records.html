<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>רשומות · ניהול · SkipperQuiz</title>
<style>
  :root{--navy:#0a1428;--card:#132447;--card2:#0f1d3a;--bd:#2a4a8a;--gold:#f1c40f;--blue:#7eb8f7;--mut:#9db4dc;--ok:#2ecc71;--bad:#e74c3c;--txt:#eaf1ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--txt);font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
  a.link{color:var(--blue);text-decoration:none;font-size:12.5px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:16px}
  label{display:block;font-size:11.5px;color:var(--mut);margin:0 0 4px}
  input,select{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;color:var(--txt);font-size:13.5px}
  input:focus,select:focus{outline:none;border-color:var(--blue)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer}
  button.ghost{background:transparent;color:var(--blue);border:1px solid var(--bd);font-weight:700}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:12.5px;min-height:16px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar .grow{flex:1;min-width:180px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
  .chip{background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--mut)}
  .chip.on{background:var(--blue);color:var(--navy);border-color:var(--blue);font-weight:700}
  .count{color:var(--mut);font-size:12px;margin-inline-start:6px}
  .tblwrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--bd)}
  th{color:var(--mut);font-weight:700;font-size:11px;position:sticky;top:0;background:var(--card2);cursor:pointer;user-select:none}
  th.nosort{cursor:default}
  tbody tr:hover{background:var(--card2)}
  td.code{font-family:monospace;color:var(--gold)}
  .tag{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700}
  .t-inst{background:rgba(126,184,247,.15);color:var(--blue);border:1px solid var(--blue)}
  .t-paid{background:rgba(46,204,113,.15);color:var(--ok);border:1px solid var(--ok)}
  .t-pend{background:rgba(241,196,15,.15);color:var(--gold);border:1px solid var(--gold)}
  .t-lead{background:rgba(157,180,220,.12);color:var(--mut);border:1px solid var(--bd)}
  .revoked{opacity:.45}
  .selcol{width:34px;text-align:center;cursor:default}
  .empty{padding:26px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>רשומות</h1>
  <div class="sub">כל המדריכים, הרוכשים והנרשמים בטבלה אחת. סינון, מיון, סימון וייצוא. · <a class="link" href="admin.html">← חזרה לניהול (הנפקת קודים)</a></div>

  <div class="card">
    <div class="grid">
      <div><label>כתובת API</label><input id="api" placeholder="https://api.alargov.com"></div>
      <div><label>ADMIN_TOKEN</label><input id="token" type="password" placeholder="הדבק את הטוקן"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
      <button class="ghost" onclick="saveCfg()">שמור</button>
      <button onclick="loadAll()" id="loadBtn">טען רשומות</button>
      <span id="cfgMsg" class="msg"></span>
    </div>
  </div>

  <div class="card">
    <div class="chips" id="chips"></div>
    <div class="toolbar">
      <div class="grow"><input id="search" placeholder="חיפוש: שם / דוא&quot;ל / בית ספר / טלפון / קוד" oninput="render()"></div>
      <button class="ghost" onclick="exportCsv()">ייצוא CSV</button>
      <span class="count" id="selInfo"></span>
    </div>
    <div class="tblwrap"><div id="tbl"><div class="empty">טען טוקן ולחץ "טען רשומות".</div></div></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const api = () => ($('api').value || 'https://api.alargov.com').replace(/\/$/, '');
  const tok = () => $('token').value.trim();

  // shared config with hub.html
  function loadCfg(){ try{ $('api').value=localStorage.getItem('hub_api')||'https://api.alargov.com'; $('token').value=localStorage.getItem('hub_tok')||''; }catch(e){} }
  function saveCfg(){ try{ localStorage.setItem('hub_api',api()); localStorage.setItem('hub_tok',tok()); flash('נשמר'); }catch(e){} }
  function flash(t,cls){ const e=$('cfgMsg'); e.textContent=t; e.className='msg '+(cls||'ok'); setTimeout(()=>e.textContent='',1600); }

  async function apiCall(path){
    const r = await fetch(api()+path, { headers:{ 'x-admin': tok() } });
    return r.json().catch(()=>({ok:false,reason:'bad-json'}));
  }
  function fmt(ts){ if(!ts) return ''; try{ return new Date(ts).toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ts; } }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // Unified record set. Each row: {type, typeLabel, name, school, email, phone, code, amount, extra, visits, devices, last, created, revoked}
  let ROWS = [];
  let FILTER = 'all';               // all | inst | paid | pend | lead
  let SORT = { key:'created', dir:-1 };
  const SEL = new Set();            // selected row keys (email+code+created)

  const TYPES = [
    ['all','הכל'], ['inst','מדריכים'], ['paid','שילמו'], ['pend','התחילו ולא שילמו'], ['lead','טעימה בלבד']
  ];

  function rowKey(r){ return r.type+'|'+(r.code||'')+'|'+(r.email||'')+'|'+(r.created||''); }

  async function loadAll(){
    if(!tok()){ $('tbl').innerHTML='<div class="empty" style="color:var(--bad)">חסר ADMIN_TOKEN.</div>'; return; }
    $('loadBtn').disabled=true; $('tbl').innerHTML='<div class="empty">טוען…</div>';
    let inst, buyers;
    try{ [inst, buyers] = await Promise.all([apiCall('/api/admin/instructors'), apiCall('/api/admin/buyers')]); }
    catch(e){ $('tbl').innerHTML='<div class="empty" style="color:var(--bad)">אין חיבור ל-API: '+esc(e.message)+'</div>'; $('loadBtn').disabled=false; return; }
    if(!(inst&&inst.ok)){ $('tbl').innerHTML='<div class="empty" style="color:var(--bad)">שגיאה: '+esc((inst&&inst.reason)||'—')+' (טוקן שגוי?)</div>'; $('loadBtn').disabled=false; return; }
    ROWS = [];
    for(const i of (inst.instructors||[])) ROWS.push({
      type:'inst', typeLabel:'מדריך', name:i.name, school:i.school, email:i.email, phone:i.phone,
      code:i.code, amount:null, extra:'', visits:i.visits||0, devices:(i.devices||0)+'/'+(i.device_limit||1),
      last:i.last_seen, created:i.created_at, revoked:!!i.revoked
    });
    if(buyers&&buyers.ok){
      for(const p of (buyers.paid||[])) ROWS.push({ type:'paid', typeLabel:'רכישה', name:'', school:'', email:p.email, phone:'', code:p.code||'', amount:p.amount_ils, extra:p.coupon_code||'', visits:'', devices:'', last:'', created:p.created_at, revoked:false });
      for(const p of (buyers.pending||[])) ROWS.push({ type:'pend', typeLabel:'התחיל ולא שילם', name:'', school:'', email:p.email, phone:'', code:'', amount:p.amount_ils, extra:'', visits:'', devices:'', last:'', created:p.created_at, revoked:false });
      for(const l of (buyers.leads||[])) ROWS.push({ type:'lead', typeLabel:'טעימה', name:'', school:'', email:l.email, phone:'', code:'', amount:null, extra:l.source||'', visits:'', devices:'', last:'', created:l.created_at, revoked:false });
    }
    SEL.clear();
    $('loadBtn').disabled=false;
    renderChips(); render();
    flash('נטענו '+ROWS.length+' רשומות');
  }

  function renderChips(){
    const counts = { all:ROWS.length, inst:0, paid:0, pend:0, lead:0 };
    for(const r of ROWS) counts[r.type]++;
    $('chips').innerHTML = TYPES.map(([k,label])=>
      '<span class="chip'+(FILTER===k?' on':'')+'" onclick="setFilter(\''+k+'\')">'+label+' <b>'+(counts[k]||0)+'</b></span>'
    ).join('');
  }
  function setFilter(k){ FILTER=k; renderChips(); render(); }

  function filtered(){
    const q = $('search').value.trim().toLowerCase();
    let rows = ROWS.filter(r => FILTER==='all' || r.type===FILTER);
    if(q){
      rows = rows.filter(r => [r.name,r.school,r.email,r.phone,r.code,r.extra].some(v => (v||'').toString().toLowerCase().includes(q)));
    }
    const { key, dir } = SORT;
    rows.sort((a,b)=>{
      let x=a[key], y=b[key];
      if(key==='amount'){ x=Number(x)||0; y=Number(y)||0; }
      else if(key==='created'||key==='last'){ x=x?new Date(x).getTime():0; y=y?new Date(y).getTime():0; }
      else if(key==='visits'){ x=Number(x)||0; y=Number(y)||0; }
      else { x=(x||'').toString(); y=(y||'').toString(); return x.localeCompare(y,'he')*dir; }
      return (x<y?-1:x>y?1:0)*dir;
    });
    return rows;
  }

  const COLS = [
    ['type','סוג'], ['name','שם'], ['school','בית ספר'], ['email','דוא"ל'], ['phone','טלפון'],
    ['code','קוד'], ['amount','סכום'], ['extra','קופון/מקור'], ['visits','שימושים'], ['devices','מכשירים'],
    ['last','פעילות אחרונה'], ['created','תאריך']
  ];

  function tagHtml(r){ const c={inst:'t-inst',paid:'t-paid',pend:'t-pend',lead:'t-lead'}[r.type]; return '<span class="tag '+c+'">'+r.typeLabel+'</span>'; }

  function render(){
    const rows = filtered();
    if(!ROWS.length){ $('tbl').innerHTML='<div class="empty">אין נתונים. לחץ "טען רשומות".</div>'; updateSel(); return; }
    let h='<table><thead><tr><th class="nosort selcol"><input type="checkbox" id="selAll" onclick="toggleAll(this)"></th>';
    for(const [k,label] of COLS){ const ar=SORT.key===k?(SORT.dir>0?' ▲':' ▼'):''; h+='<th onclick="sortBy(\''+k+'\')">'+label+ar+'</th>'; }
    h+='</tr></thead><tbody>';
    if(!rows.length){ h+='<tr><td colspan="'+(COLS.length+1)+'" class="empty">אין רשומות תואמות.</td></tr>'; }
    for(const r of rows){
      const key=rowKey(r);
      h+='<tr class="'+(r.revoked?'revoked':'')+'">'
        +'<td class="selcol"><input type="checkbox" '+(SEL.has(key)?'checked':'')+' onclick="toggleRow(\''+key.replace(/'/g,"\\'")+'\',this)"></td>'
        +'<td>'+tagHtml(r)+(r.revoked?' <span class="tag t-lead">מבוטל</span>':'')+'</td>'
        +'<td>'+esc(r.name)+'</td>'
        +'<td>'+esc(r.school)+'</td>'
        +'<td>'+esc(r.email)+'</td>'
        +'<td>'+esc(r.phone)+'</td>'
        +'<td class="code">'+esc(r.code)+'</td>'
        +'<td>'+(r.amount==null||r.amount===''?'':'₪'+Number(r.amount))+'</td>'
        +'<td>'+esc(r.extra)+'</td>'
        +'<td>'+esc(r.visits)+'</td>'
        +'<td>'+esc(r.devices)+'</td>'
        +'<td>'+fmt(r.last)+'</td>'
        +'<td>'+fmt(r.created)+'</td>'
        +'</tr>';
    }
    h+='</tbody></table>';
    $('tbl').innerHTML=h;
    const all=$('selAll'); if(all){ const keys=rows.map(rowKey); all.checked = keys.length>0 && keys.every(k=>SEL.has(k)); }
    updateSel();
  }

  function sortBy(k){ if(SORT.key===k) SORT.dir*=-1; else SORT={key:k,dir:1}; render(); }
  function toggleRow(key,el){ if(el.checked) SEL.add(key); else SEL.delete(key); updateSel(); const all=$('selAll'); if(all){ const keys=filtered().map(rowKey); all.checked=keys.every(k=>SEL.has(k)); } }
  function toggleAll(el){ const keys=filtered().map(rowKey); if(el.checked) keys.forEach(k=>SEL.add(k)); else keys.forEach(k=>SEL.delete(k)); render(); }
  function updateSel(){ $('selInfo').textContent = SEL.size ? ('נבחרו '+SEL.size) : ''; }

  function exportCsv(){
    // Selected rows if any; otherwise everything currently filtered.
    let rows = filtered();
    if(SEL.size){ const keys=new Set([...SEL]); rows = rows.filter(r=>keys.has(rowKey(r))); }
    if(!rows.length){ flash('אין רשומות לייצוא','err'); return; }
    const head = ['סוג','שם','בית ספר','דוא"ל','טלפון','קוד','סכום','קופון/מקור','שימושים','מכשירים','פעילות אחרונה','תאריך','מבוטל'];
    const cell = v => { v=(v==null?'':String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const lines = [head.join(',')];
    for(const r of rows){
      lines.push([r.typeLabel,r.name,r.school,r.email,r.phone,r.code,(r.amount==null||r.amount===''?'':r.amount),r.extra,r.visits,r.devices,fmt(r.last),fmt(r.created),r.revoked?'כן':''].map(cell).join(','));
    }
    const blob = new Blob(['\uFEFF'+lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href=url; a.download='skipperquiz-records-'+FILTER+'-'+stamp+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  loadCfg();
  if(tok()) loadAll();
</script>
</body>
</html>
