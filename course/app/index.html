*{box-sizing:border-box;font-family:'Heebo',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(circle at 50% 15%,#0e1c3d,#050b1a 70%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
a{color:#7eb8f7}
::-webkit-scrollbar{display:none}
button{font-family:inherit}
.phone{width:402px;max-width:100%;height:860px;max-height:96vh;background:#0a1428;border-radius:44px;border:1px solid #1c2c50;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.7);overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#0a1428;border-radius:0 0 16px 16px;z-index:30}
.scene{flex:1;display:flex;flex-direction:column;background:#0a1428;color:#fff;overflow:hidden;position:relative}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none}
@media(max-width:440px){
  body{padding:0}
  .phone{width:100vw;height:100vh;max-height:100vh;border-radius:0;border:none;box-shadow:none}
  .notch{display:none}
}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .34s ease}
.shake{animation:shake .42s ease}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
.xpfloat{animation:floatUp 1.1s ease forwards}
</style>

<script>
let LESSON_Q = {};                 // populated from the API at boot
const VIDEO_DATA = window.__VIDEO_DATA__ || {};
const LETTERS=['א','ב','ג','ד','ה'];

/* ===== API (course server) ===== */
let API_BASE = (localStorage.getItem('sq_api')||'https://api.alargov.com').replace(/\/$/,'');
let BRAND='לומדה', PRODUCT='רישיון אופנוע ים', PRICE=199, PRICING=null, CHECKOUT_OPEN=false;
function storedCode(){try{return localStorage.getItem('sq_code')||'';}catch(e){return '';}}
function storeCode(c){try{localStorage.setItem('sq_code',c);}catch(e){}}
function clearCode(){try{localStorage.removeItem('sq_code');}catch(e){}}
// The httpOnly sid cookie is the working credential; every call sends it. The raw
// code is kept only to (re)open a session if the cookie is lost or superseded.
async function apiJson(path,opts){opts=opts||{};opts.credentials='include';const r=await fetch(API_BASE+path,opts);return r.json().catch(()=>({ok:false,reason:'bad-json'}));}
async function apiConfig(){return apiJson('/api/config');}
async function apiFree(){return apiJson('/api/free');}
async function sessionStart(code){return apiJson('/api/session/start',{method:'POST',headers:{'x-code':code}});}
// One silent retry: a superseded cookie (a copy grabbed the slot) or an expired one
// re-opens a session from the stored code, then repeats the call.
async function authed(path,opts){let r=await apiJson(path,opts);if(r&&r.reason&&/superseded|no-session/.test(r.reason)){const c=storedCode();if(c){const s=await sessionStart(c);if(s&&s.ok)r=await apiJson(path,opts);}}return r;}
async function apiContent(){return authed('/api/content');}
async function apiGetProgress(){return authed('/api/progress');}
async function apiSaveProgress(data){return authed('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});}
function applyContent(resp){LESSON_Q={};const L=(resp&&resp.lessons)||{};for(const k in L)LESSON_Q[k]=(L[k].questions||[]);rebuildIndex();}
async function unlockWithCode(code){const s=await sessionStart(code);if(!(s&&s.ok)){const m=s&&s.reason==='device-limit'?'הקוד כבר בשימוש במספר המכשירים המרבי':s&&s.reason==='revoked'?'הגישה בוטלה':'קוד לא תקין';toast(m);return s;}storeCode(code);const r=await apiContent();if(r&&r.ok){applyContent(r);st.owned=true;await syncProgressDown();toast('נפתחה גישה מלאה 🎉');go('home');}else{toast(r&&r.reason==='revoked'?'הגישה בוטלה':'קוד לא תקין');}return r;}
function promptCode(){const c=prompt('הזן קוד גישה (מהרכישה או מהמדריך):');if(c&&c.trim())unlockWithCode(c.trim());}
async function logout(){clearCode();st.owned=false;st.done=new Set();try{await apiJson('/api/session/end',{method:'POST'});}catch(e){}try{const f=await apiFree();if(f&&f.ok)applyContent(f);}catch(e){}stopSpeak();go('onboarding');toast('התנתקת — חזרת למצב טעימה');}
async function syncProgressDown(){try{const r=await apiGetProgress();if(r&&r.ok&&r.data){const d=r.data;if(typeof d.xp==='number')st.xp=Math.max(st.xp,d.xp);if(d.srs)st.srs=Object.assign({},d.srs,st.srs);if(d.topicStats)st.topicStats=Object.assign({},d.topicStats,st.topicStats);if(Array.isArray(d.done))d.done.forEach(x=>st.done.add(x));if(Array.isArray(d.examLog)){const seen=new Set((st.examLog||[]).map(e=>e.ts));d.examLog.forEach(e=>{if(e&&!seen.has(e.ts)){seen.add(e.ts);st.examLog.push(e);}});st.examLog.sort((a,b)=>(a.ts<b.ts?-1:1));if(st.examLog.length>50)st.examLog=st.examLog.slice(-50);}persist();render();}}catch(e){}}
let _pushT;function pushProgress(){if(!st.owned)return;if(!storedCode())return;clearTimeout(_pushT);_pushT=setTimeout(()=>{apiSaveProgress({xp:st.xp,srs:st.srs,topicStats:st.topicStats,done:[...st.done],sound:st.sound,examLog:st.examLog});},700);}
async function handleReturn(){
  const u=new URL(location.href);const token=u.searchParams.get('token');if(!token)return false;
  toast('מאמת תשלום…');
  for(let i=0;i<25;i++){const s=await apiJson('/api/order/status?token='+encodeURIComponent(token));if(s&&s.ok&&s.status==='paid'&&s.code){history.replaceState({},'',u.pathname);await unlockWithCode(s.code);return true;}await new Promise(r=>setTimeout(r,800));}
  history.replaceState({},'',u.pathname);toast('לא התקבל אישור תשלום. אם חויבת, הקוד נשלח למייל.');return false;
}
async function bootstrap(){
  try{const cfg=await apiConfig();if(cfg&&cfg.ok){BRAND=cfg.brand_name||BRAND;PRODUCT=cfg.product_title||PRODUCT;PRICE=cfg.price_ils||PRICE;PRICING=cfg.pricing||PRICING;CHECKOUT_OPEN=!!cfg.checkout_open;}}catch(e){}
  if(await handleReturn())return;
  const code=storedCode();
  if(code){const s=await sessionStart(code);if(s&&s.ok){const r=await apiContent();if(r&&r.ok){applyContent(r);st.owned=true;if(st.screen==='onboarding')st.screen='home';render();await syncProgressDown();return;}}clearCode();}
  try{const f=await apiFree();if(f&&f.ok)applyContent(f);else toast('לא הצלחתי לטעון תוכן מהשרת');}catch(e){toast('אין חיבור לשרת');}
  st.owned=false;render();
  // Arriving from the landing "רכוש עכשיו" button (?buy=1): open the purchase flow.
  const bu=new URL(location.href);if(bu.searchParams.get('buy')&&CHECKOUT_OPEN&&!st.owned){history.replaceState({},'',bu.pathname);buy();}
}

function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function boldTerm(f){const m=f.match(/<b>(.*?)<\/b>/);return m?m[1]:'';}
function buildCards(l){
  if(l.cards)return l.cards;

  l.facts.forEach(f=>{const t=boldTerm(f)||'נקודת מפתח';cards.push({isContent:true,kicker:l.title,title:t,body:strip(f),highlight:''});});

function srsLapse(num){const p=st.srs[num]||{lapses:0};st.srs[num]={due:today()+1,interval:1,lapses:(p.lapses||0)+1};}

function dueNums(){const t=today();return Object.keys(st.srs).filter(n=>st.srs[n].due<=t);}

let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,t0,dur,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||0.08;o.connect(g);g.connect(a.destination);const t=a.currentTime+t0;o.start(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.stop(t+dur);}

function burst(){const p=document.querySelector('.phone')||document.body;for(let i=0;i<14;i++){const e=document.createElement('div');const cs=['#f1c40f','#2ecc71','#7eb8f7','#fb7185'];e.style.cssText=`position:absolute;top:130px;left:50%;width:8px;height:8px;border-radius:2px;background:${cs[i%4]};z-index:79;pointer-events:none`;p.appendChild(e);const dx=(Math.random()*2-1)*140,dy=-(60+Math.random()*160),rot=Math.random()*360;e.animate([{transform:'translate(-50%,0) rotate(0)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),${dy}px) rotate(${rot}deg)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'});setTimeout(()=>e.remove(),1300);}}

// Log one full timed mock-exam attempt (the 50-min simulation). Refund policy

function logExamAttempt(){
  if(st.mode!=='timed'||st._examLogged)return;
  st._examLogged=true;
  const total=st.pool.length||1;
  const passed=st.score>=Math.ceil(total*0.85);
  if(!Array.isArray(st.examLog))st.examLog=[];
  st.examLog.push({ts:new Date().toISOString(),pct:Math.round(st.score/total*100),correct:st.score,total,passed,timeUp:!!st.timeUp});
  if(st.examLog.length>50)st.examLog=st.examLog.slice(-50);
  persist();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function allQuestions(){const out=[];LESSONS.forEach(l=>{if(l.final)return;(LESSON_Q[l.id]||[]).forEach(q=>out.push(Object.assign({},q,{_lid:l.id})));});return out;}
function dedupeByNum(list){const seen=new Set(),out=[];list.forEach(q=>{if(!seen.has(q.num)){seen.add(q.num);out.push(q);}});return out;}
function examBank(){return dedupeByNum(allQuestions());}
function startTimedExam(){const p=shuffle(examBank()).slice(0,30);if(!p.length){toast('אין שאלות זמינות למבחן');return;}beginQuiz(p,'timed',{timed:true,seconds:50*60});}

function fmtTime(s){s=Math.max(0,s|0);const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}

  if(el){el.textContent='⏱ '+fmtTime(st.secLeft);if(st.secLeft<=60)el.style.color=C.bad;}
  if(st.secLeft<=0){stopExamTimer();stopSpeak();st.timeUp=true;st.done.add(st.lessonId);go('results');}
},1000);}

  ${q.vid?`<div style="text-align:center;margin-bottom:14px"><video id="quizVideo" controls autoplay playsinline preload="auto" src="${q.vid}" style="max-width:100%;max-height:60vh;display:inline-block;vertical-align:top;background:#000;border-radius:12px"></video></div>`:''}

  <button data-act="tourq" style="margin-top:14px;background:${C.gold};color:${C.navy};border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:900;cursor:pointer">לשאלה על הנושא ←</button>
</div>`;
  }
  // phase === 'q'
  const answered=st.selected!==null,correct=st.selected===q.c;
  const opts=q.opts.map((t,i)=>{
    let bg=C.card2,bd=C.bd,lbg='#0c1a3a',lc=C.blue,tc='#fff',op=1,cls='';
    if(answered){if(i===q.c){bg=C.okBg;bd=C.ok;lbg=C.ok;lc=C.okBg;tc=C.ok;cls='pop';}else if(i===st.selected){bg=C.badBg;bd=C.bad;lbg=C.bad;lc='#fff';tc=C.bad;cls='shake';}else op=.35;}
    return `<div ${answered?'':`data-tans="${i}"`} class="${cls}" style="display:flex;align-items:center;gap:10px;background:${bg};border:1px solid ${bd};border-radius:11px;padding:12px 14px;opacity:${op};cursor:${answered?'default':'pointer'}">
      <div style="width:24px;height:24px;border-radius:50%;background:${lbg};color:${lc};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0">${LETTERS[i]}</div>
      <div style="font-size:13px;font-weight:700;color:${tc};line-height:1.4">${t}</div>
    </div>`;}).join('');
  return `
<div style="padding:44px 20px 24px;display:flex;flex-direction:column;min-height:100%">
  ${head}
  ${q.vid?`<div style="text-align:center;margin-bottom:14px"><video controls playsinline preload="metadata" src="${q.vid}" style="max-width:100%;max-height:52vh;display:inline-block;vertical-align:top;background:#000;border-radius:12px"></video></div>`:''}
  <div style="background:${C.card};border:1px solid ${C.bd};border-radius:16px;padding:16px;margin-bottom:16px">
    <div style="font-size:15px;font-weight:700;line-height:1.6">${q.q}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:9px">${opts}</div>
  ${answered?`
  <div class="pop" style="background:${correct?C.okBg:C.badBg};border:1px solid ${correct?C.ok:C.bad};border-radius:12px;padding:14px 16px;margin-top:16px">
    <div style="font-size:12.5px;font-weight:900;color:${correct?C.ok:C.bad};margin-bottom:6px">${correct?'✅ תשובה נכונה!':'❌ לא בדיוק — בוא נבין למה'}</div>
    ${!correct?`<div style="font-size:12.5px;font-weight:800;color:${C.okT};margin-bottom:6px">התשובה הנכונה (${LETTERS[q.c]}): ${q.opts[q.c]}</div>`:''}
    <div style="font-size:12.5px;line-height:1.6;color:#dce8ff">${q.exp||''}</div>
  </div>
  ${tourCtaHtml(last)}
  <button data-act="${last?'home':'tournext'}" style="margin-top:14px;background:transparent;border:1px solid ${C.bd};color:${C.blue};border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer">${last?'סיום הטעימה':'לשאלה הבאה ←'}</button>`:''}
</div>`;}

function vResults(){
  const total=st.pool.length,pass=!st.gameOver&&st.score>=Math.ceil(total*0.85);
  const weak=weakLessons(1);
  const emoji=st.timeUp?'⏰':st.gameOver?'💔':pass?'🏆':'💪';
  const title=st.timeUp?'נגמר הזמן':st.gameOver?'נגמרו הלבבות':pass?'עברת בהצלחה!':'סיימת את התרגול';
  const sub=st.timeUp?'הזמן שהוקצב למבחן נגמר. שאלות שלא נענו נחשבות כשגויות. נסה שוב.':st.gameOver?'אל דאגה — כל שאלה שטעית בה נשמרה לחזרה חכמה. נסה שוב.':pass?'רמת השליטה שלך גבוהה. אפשר להתקדם.':'כדאי לחזור על החומר ולנסות שוב.';
  return `
<div style="padding:66px 24px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%">
  <div style="font-size:44px;margin-bottom:10px">${emoji}</div>
  <div style="font-size:22px;font-weight:900;margin-bottom:6px">${title}</div>
  <div style="color:${C.mut};font-size:13.5px;line-height:1.6;margin-bottom:20px">${sub}</div>
  <div style="display:flex;gap:10px;width:100%;margin-bottom:16px">
    <div style="flex:1;background:${C.card};border:1px solid ${C.bd};border-radius:16px;padding:18px"><div style="font-size:28px;font-weight:900;color:${C.ok}">${st.score}/${total}</div><div style="font-size:11px;color:${C.blue};font-weight:700;margin-top:3px">תשובות נכונות</div></div>
    <div style="flex:1;background:${C.card};border:1px solid ${C.bd};border-radius:16px;padding:18px"><div style="font-size:28px;font-weight:900;color:${C.gold}">רמה ${levelOf(st.xp)}</div><div style="font-size:11px;color:${C.blue};font-weight:700;margin-top:3px">${st.xp} XP</div></div>
  </div>
  ${weak.length?`<button data-act="reinforce" style="width:100%;background:${C.card2};border:1px solid ${C.gold};color:${C.gold};border-radius:12px;padding:13px;font-size:12.5px;font-weight:900;cursor:pointer;margin-bottom:10px">🎯 מבחן חיזוק על הנושאים החלשים (${weak.length})</button>`:''}
  <button data-act="retry" style="width:100%;background:transparent;border:1px solid ${C.bd};color:${C.blue};border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:10px">נסה שוב</button>
  <button data-act="home" style="width:100%;background:${C.gold};color:${C.navy};border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:900;cursor:pointer">חזרה לשיעורים</button>
</div>`;}

  const total=LESSONS.length,doneN=[...st.done].length,pct=Math.round(doneN/total*100);
  return `
<div style="padding:60px 20px 24px">
  <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px">
    <div style="width:64px;height:64px;border-radius:50%;background:${C.card2};border:1px solid ${C.bd};display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px">⚓</div>
    <div style="font-size:17px;font-weight:900">אלכס ארגוב</div>
    <div style="color:${C.blue};font-size:12px;font-weight:700">מועמד לרישיון אופנוע ים</div>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:20px">
    ${[[`${doneN}/${total}`,'שיעורים',C.gold],[`${pct}%`,'התקדמות',C.ok],['4🔥','ימי רצף',C.blue]].map(([v,t,col])=>`<div style="flex:1;background:${C.card};border:1px solid ${C.bd};border-radius:12px;padding:14px;text-align:center"><div style="font-size:20px;font-weight:900;color:${col}">${v}</div><div style="font-size:10.5px;color:${C.mut};margin-top:2px">${t}</div></div>`).join('')}
  </div>
  <button data-act="sound" style="width:100%;background:transparent;border:1px solid ${C.bd};color:#fff;border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:10px">${st.sound?'🔊 צלילים: פעיל':'🔇 צלילים: כבוי'}</button>
  <button data-act="manage" style="width:100%;background:transparent;border:1px solid ${C.bd};color:#fff;border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer">ניהול מנוי</button>
  ${st.owned?`<button data-act="logout" style="width:100%;background:transparent;border:1px solid ${C.bd};color:${C.dim};border-radius:12px;padding:13px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:10px">התנתק · נקה גישה במכשיר</button>`:''}
</div>`;}

function vPractice(){
  const totalQ=examBank().length;
  return `
<div style="padding:60px 20px 24px">
  <div style="font-size:20px;font-weight:900;margin-bottom:2px">תרגול ומבחנים</div>
  <div style="color:${C.blue};font-size:13px;font-weight:700;margin-bottom:20px">בחר איך לתרגל</div>
  <div style="background:${C.card2};border:1px solid ${C.gold};border-radius:16px;padding:18px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:22px">⏱</span><div style="font-size:16px;font-weight:900">מבחן מדומה</div></div>
    <div style="color:${C.mut};font-size:13px;line-height:1.6;margin-bottom:12px">30 שאלות אקראיות · 50 דקות · טיימר. הדמיה של מבחן התאוריה, עם ציון עובר בסוף.</div>
    <button data-act="timedexam" style="width:100%;background:${C.gold};color:${C.navy};border:none;border-radius:11px;padding:12px;font-size:13.5px;font-weight:900;cursor:pointer">התחל מבחן מדומה</button>
  </div>
  <div style="background:${C.card};border:1px solid ${C.bd};border-radius:16px;padding:18px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:22px">♾️</span><div style="font-size:16px;font-weight:900">מבחן רציף</div></div>
    <div style="color:${C.mut};font-size:13px;line-height:1.6;margin-bottom:12px">כל השאלות ברצף, בלי טיימר. אפשר לעצור באמצע ולהמשיך מתי שרוצים.${totalQ?` (${totalQ} שאלות)`:''}</div>
    <button data-act="continuous" style="width:100%;background:transparent;border:1px solid ${C.gold};color:${C.gold};border-radius:11px;padding:12px;font-size:13.5px;font-weight:900;cursor:pointer">התחל מבחן רציף</button>
  </div>
  ${st.owned?'':`
  <div style="background:${C.card};border:1px solid ${C.bd};border-radius:14px;padding:16px;margin-top:8px;text-align:center">
    <div style="font-size:12px;color:${C.mut};line-height:1.6;margin-bottom:12px">בטעימה זמינות 13 שאלות מודרכות — אחת מכל נושא, עם הצצה מהשיעור. בנק השאלות המלא נפתח בגרסה המלאה.</div>
    <button data-act="start" style="width:100%;background:${C.gold};color:${C.navy};border:none;border-radius:11px;padding:12px;font-size:13.5px;font-weight:900;cursor:pointer;margin-bottom:9px">🎁 התחל טעימה מודרכת</button>
    <button data-act="buy" style="width:100%;background:transparent;border:1px solid ${C.gold};color:${C.gold};border-radius:11px;padding:12px;font-size:13px;font-weight:900;cursor:pointer;margin-bottom:9px">פתח את הקורס</button>
    <div data-act="havecode" style="font-size:12px;color:${C.blue};font-weight:700;cursor:pointer">יש לי קוד גישה</div>
  </div>`}
</div>`;}

function vTab(){
  const s=st.screen;
  const item=(act,icon,label,active)=>`<div data-act="${act}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0">
    <div style="display:flex;align-items:center;justify-content:center;width:48px;height:30px;border-radius:15px;font-size:17px;background:${active?'rgba(241,196,15,.16)':'transparent'};transition:background .2s">${icon}</div>
    <div style="font-size:10px;font-weight:800;color:${active?C.gold:C.dim}">${label}</div>
  </div>`;
  return `<div style="display:flex;border-top:1px solid ${C.bd2};background:#0c1a3a;padding:8px 16px 22px">
    ${item('home','🏠','בית',s==='home')}
    ${item('practice','📝','תרגול',s==='practice'||s==='quiz')}
    ${item('profile','👤','פרופיל',s==='profile')}
  </div>`;}

/* ===== BIND ===== */
function bindActions(){
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>openLesson(+e.getAttribute('data-open')));
  document.querySelectorAll('[data-ans]').forEach(e=>e.onclick=()=>selectAns(+e.getAttribute('data-ans')));
  document.querySelectorAll('[data-tans]').forEach(e=>e.onclick=()=>tourAns(+e.getAttribute('data-tans')));
  document.querySelectorAll('[data-act]').forEach(e=>{
    const a=e.getAttribute('data-act');
    e.onclick=()=>{
      if(a==='start'){if(st.owned)go('home');else startTour();}
      else if(a==='tourq')tourToQuestion();
      else if(a==='tournext')tourNext();
      else if(a==='home'){stopSpeak();go('home');}
      else if(a==='prev')prevCard();
      else if(a==='next')nextCard();
      else if(a==='vo')toggleVo();
      else if(a==='toquiz')startQuiz(st.lessonId);
      else if(a==='nextq')nextQ();
      else if(a==='quit'){stopExamTimer();stopSpeak();const qv=document.getElementById('quizVideo');if(qv)qv.pause();go('home');}
      else if(a==='pause')pauseQuiz();
      else if(a==='resume')resumeQuiz();
      else if(a==='skip')nextQ();
      else if(a==='retry'){if(st.mode==='review')startReview();else if(st.mode==='reinforce')startReinforcement();else if(st.mode==='timed')startTimedExam();else if(st.mode==='continuous')startContinuous();else startQuiz(st.lessonId,st.mode);}
      else if(a==='review')startReview();
      else if(a==='reinforce')startReinforcement();
      else if(a==='timedexam')startTimedExam();
      else if(a==='continuous')startContinuous();
      else if(a==='practice')go('practice');
      else if(a==='profile'){stopSpeak();go('profile');}
      else if(a==='sound'){st.sound=!st.sound;persist();toast(st.sound?'🔊 צלילים פעילים':'🔇 צלילים כבויים');render();}
      else if(a==='manage')toast('ניהול מנוי — יחובר למערכת החיוב (Tranzila).');
      else if(a==='logout')logout();
      else if(a==='havecode')promptCode();
      else if(a==='buy')buy();
    };
  });
  const lv=document.getElementById('lessonVideo');
  if(lv){
    lv.onended=()=>{st.videoEnded=true;render();const h=document.getElementById('videoCta');if(h)h.scrollIntoView({behavior:'smooth',block:'center'});};
    if(!st.videoEnded&&st.cardIndex===0&&lv.play)lv.play().catch(()=>{});
  }
  const tv=document.getElementById('tourVideo');
  if(tv){
    stopSpeak();stopPitch();
    let advanced=false;
    const toQ=()=>{if(advanced||st.tourPhase!=='intro')return;advanced=true;try{tv.pause();}catch(e){}tourToQuestion();};
    tv.ontimeupdate=()=>{if(tv.currentTime>=30)toQ();}; // 30s taster → jump to the question
    tv.onended=toQ;                                     // shorter clip → same
    if(tv.play)tv.play().catch(()=>{});
  }
  const qv=document.getElementById('quizVideo');
  if(qv){
    stopSpeak();
    qv.ontimeupdate=()=>{
      st.qvTime=qv.currentTime;
      const q=st.pool[st.qIndex];
      if(q&&q.p&&st.selected===null&&qv.duration&&isFinite(qv.duration)&&qv.currentTime>=q.p*qv.duration){qv.pause();showPauseHint();}
    };
    if(st.qvTime>0.1){const seek=()=>{try{qv.currentTime=st.qvTime;}catch(e){}};if(qv.readyState>=1)seek();else qv.onloadedmetadata=seek;}
    if(qv.play)qv.play().catch(()=>{});
  }
}

/* toast */
let tT;function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a2f5e;border:1px solid #2a4a8a;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:99;max-width:340px;text-align:center;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(tT);tT=setTimeout(()=>t.style.opacity='0',2600);}

if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}
loadPersist();
render();
bootstrap();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
