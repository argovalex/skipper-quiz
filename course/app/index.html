<script>
let LESSON_Q = {};                 // populated from the API at boot
const VIDEO_DATA = window.__VIDEO_DATA__ || {};
const LETTERS=['א','ב','ג','ד','ה'];

/* ===== API (course server) ===== */
let API_BASE = (localStorage.getItem('sq_api')||'https://api.alargov.com').replace(/\/$/,'');
let BRAND='לומדה', PRODUCT='רישיון אופנוע ים', PRICE=199, PRICING=null, CHECKOUT_OPEN=false;
function storedCode(){try{return localStorage.getItem('sq_code')||'';}catch(e){return '';}}
function storeCode(c){try{localStorage.setItem('sq_code',c);}catch(e){}}
function clearCode(){try{localStorage.removeItem('sq_code');}catch(e){}}
// The httpOnly sid cookie is the working credential; every call sends it. The raw
// code is kept only to (re)open a session if the cookie is lost or superseded.
async function apiJson(path,opts){opts=opts||{};opts.credentials='include';const r=await fetch(API_BASE+path,opts);return r.json().catch(()=>({ok:false,reason:'bad-json'}));}
async function apiConfig(){return apiJson('/api/config');}
async function apiFree(){return apiJson('/api/free');}
async function sessionStart(code){return apiJson('/api/session/start',{method:'POST',headers:{'x-code':code}});}
// One silent retry: a superseded cookie (a copy grabbed the slot) or an expired one
// re-opens a session from the stored code, then repeats the call.
async function authed(path,opts){let r=await apiJson(path,opts);if(r&&r.reason&&/superseded|no-session/.test(r.reason)){const c=storedCode();if(c){const s=await sessionStart(c);if(s&&s.ok)r=await apiJson(path,opts);}}return r;}
async function apiContent(){return authed('/api/content');}
async function apiGetProgress(){return authed('/api/progress');}
async function apiSaveProgress(data){return authed('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});}
function applyContent(resp){LESSON_Q={};const L=(resp&&resp.lessons)||{};for(const k in L)LESSON_Q[k]=(L[k].questions||[]);rebuildIndex();}
async function unlockWithCode(code){const s=await sessionStart(code);if(!(s&&s.ok)){const m=s&&s.reason==='device-limit'?'הקוד כבר בשימוש במספר המכשירים המרבי':s&&s.reason==='revoked'?'הגישה בוטלה':'קוד לא תקין';toast(m);return s;}storeCode(code);const r=await apiContent();if(r&&r.ok){applyContent(r);st.owned=true;await syncProgressDown();toast('נפתחה גישה מלאה 🎉');go('home');}else{toast(r&&r.reason==='revoked'?'הגישה בוטלה':'קוד לא תקין');}return r;}
function promptCode(){const c=prompt('הזן קוד גישה (מהרכישה או מהמדריך):');if(c&&c.trim())unlockWithCode(c.trim());}
async function logout(){clearCode();st.owned=false;st.done=new Set();try{await apiJson('/api/session/end',{method:'POST'});}catch(e){}try{const f=await apiFree();if(f&&f.ok)applyContent(f);}catch(e){}stopSpeak();go('onboarding');toast('התנתקת — חזרת למצב טעימה');}
async function syncProgressDown(){try{const r=await apiGetProgress();if(r&&r.ok&&r.data){const d=r.data;if(typeof d.xp==='number')st.xp=Math.max(st.xp,d.xp);if(d.srs)st.srs=Object.assign({},d.srs,st.srs);if(d.topicStats)st.topicStats=Object.assign({},d.topicStats,st.topicStats);if(Array.isArray(d.done))d.done.forEach(x=>st.done.add(x));persist();render();}}catch(e){}}
let _pushT;function pushProgress(){if(!st.owned)return;if(!storedCode())return;clearTimeout(_pushT);_pushT=setTimeout(()=>{apiSaveProgress({xp:st.xp,srs:st.srs,topicStats:st.topicStats,done:[...st.done],sound:st.sound});},700);}
async function handleReturn(){
  const u=new URL(location.href);const token=u.searchParams.get('token');if(!token)return false;
  toast('מאמת תשלום…');
  for(let i=0;i<25;i++){const s=await apiJson('/api/order/status?token='+encodeURIComponent(token));if(s&&s.ok&&s.status==='paid'&&s.code){history.replaceState({},'',u.pathname);await unlockWithCode(s.code);return true;}await new Promise(r=>setTimeout(r,800));}
  history.replaceState({},'',u.pathname);toast('לא התקבל אישור תשלום. אם חויבת, הקוד נשלח למייל.');return false;
}
async function bootstrap(){
  try{const cfg=await apiConfig();if(cfg&&cfg.ok){BRAND=cfg.brand_name||BRAND;PRODUCT=cfg.product_title||PRODUCT;PRICE=cfg.price_ils||PRICE;PRICING=cfg.pricing||PRICING;CHECKOUT_OPEN=!!cfg.checkout_open;}}catch(e){}
  if(await handleReturn())return;
  const code=storedCode();
  if(code){const s=await sessionStart(code);if(s&&s.ok){const r=await apiContent();if(r&&r.ok){applyContent(r);st.owned=true;if(st.screen==='onboarding')st.screen='home';render();await syncProgressDown();return;}}clearCode();}
  try{const f=await apiFree();if(f&&f.ok)applyContent(f);else toast('לא הצלחתי לטעון תוכן מהשרת');}catch(e){toast('אין חיבור לשרת');}
  st.owned=false;render();
}

const byId=id=>LESSONS.find(l=>l.id===id);
// Free trial: every lesson is locked until payment. The only free content is the
// guided tour (vTour) — a fixed 13-question sampler with a 30s lesson intro before
// each question and a signup CTA after each. Owners unlock everything.
function lessonLocked(id){return !st.owned;}

/* ===== STATE ===== */
const st={screen:'onboarding',lessonId:11,cardIndex:0,qIndex:0,selected:null,score:0,vo:false,videoEnded:false,qvTime:0,
  done:new Set(),owned:false,pool:[],
  xp:0,streak:0,hearts:5,heartsOn:false,mode:'practice',srs:{},topicStats:{},sound:true,fx:null,gameOver:false,
  paused:false,timed:false,secLeft:0,timeUp:false,
  tour:[],tourIdx:0,tourPhase:'intro'};

/* ===== helpers ===== */
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function boldTerm(f){const m=f.match(/<b>(.*?)<\/b>/);return m?m[1]:'';}
function buildCards(l){
  if(l.cards)return l.cards;
  const cards=[{isContent:true,kicker:l.kicker,title:l.title,body:l.overview,highlight:l.theme}];
  l.facts.forEach(f=>{const t=boldTerm(f)||'נקודת מפתח';cards.push({isContent:true,kicker:l.title,title:t,body:strip(f),highlight:''});});
  cards.push({isRecap:true,kicker:'סיכום',title:'מה לזכור',bullets:l.facts.map(strip),trap:l.trap});
  return cards;
}
function qcopy(list,lid){return (list||[]).map(q=>Object.assign({},q,{_lid:lid}));}
function quizFor(l){
  if(l.final){const out=[];LESSONS.forEach(x=>{if(x.final)return;qcopy(LESSON_Q[x.id],x.id).slice(0,2).forEach(q=>out.push(q));});return out.slice(0,24);}
  return qcopy(LESSON_Q[l.id],l.id).slice(0,12);
}

/* ===== מפת שאלות לפי מספר (למנוע החזרות) ===== */
let QBYNUM={};
function rebuildIndex(){QBYNUM={};LESSONS.forEach(l=>{if(l.final)return;(LESSON_Q[l.id]||[]).forEach(q=>{if(!QBYNUM[q.num])QBYNUM[q.num]=Object.assign({},q,{_lid:l.id});});});}
rebuildIndex();

/* ===== גיימיפיקציה: XP, רמות, לבבות, סטריק ===== */
const today=()=>Math.floor(Date.now()/864e5);
const levelOf=xp=>Math.floor((xp||0)/100)+1;
function addXp(g){const prev=levelOf(st.xp);st.xp+=g;if(levelOf(st.xp)>prev){sfx('level');toast('🎉 עלית לרמה '+levelOf(st.xp)+'!');burst();}}
function bumpTopic(lid,ok){const t=st.topicStats[lid]||(st.topicStats[lid]={seen:0,correct:0});t.seen++;if(ok)t.correct++;}
function weakLessons(min){return LESSONS.filter(l=>!l.final&&st.topicStats[l.id]&&st.topicStats[l.id].seen>=(min||3))
  .map(l=>({l,acc:st.topicStats[l.id].correct/st.topicStats[l.id].seen}))
  .filter(x=>x.acc<0.75).sort((a,b)=>a.acc-b.acc);}

/* ===== חזרות מרווחות (SRS, SM-2 מפושט) ===== */
function srsLapse(num){const p=st.srs[num]||{lapses:0};st.srs[num]={due:today()+1,interval:1,lapses:(p.lapses||0)+1};}
function srsPromote(num){const p=st.srs[num];if(!p)return;const iv=Math.max(2,Math.round((p.interval||1)*2.3));if(iv>=21){delete st.srs[num];}else{st.srs[num]={due:today()+iv,interval:iv,lapses:p.lapses};}}
function dueNums(){const t=today();return Object.keys(st.srs).filter(n=>st.srs[n].due<=t);}
function buildReviewPool(){return dueNums().map(n=>QBYNUM[n]).filter(Boolean).map(q=>Object.assign({},q)).slice(0,20);}
function buildReinforcePool(){const w=weakLessons(3);const out=[];w.slice(0,3).forEach(x=>{qcopy(LESSON_Q[x.l.id],x.l.id).slice(0,5).forEach(q=>out.push(q));});return out.slice(0,15);}

/* ===== צלילים (WebAudio) ואנימציות ===== */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,t0,dur,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||0.08;o.connect(g);g.connect(a.destination);const t=a.currentTime+t0;o.start(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.stop(t+dur);}
function sfx(kind){if(!st.sound)return;if(kind==='correct'){tone(660,0,.12,'sine',.09);tone(880,.1,.16,'sine',.09);}else if(kind==='wrong'){tone(180,0,.28,'sawtooth',.07);}else if(kind==='level'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.16,'triangle',.08));}else if(kind==='heart'){tone(300,0,.16,'square',.06);tone(200,.12,.2,'square',.06);}}
function floaty(txt,color){const p=document.querySelector('.phone')||document.body;const e=document.createElement('div');e.className='xpfloat';e.textContent=txt;e.style.cssText=`position:absolute;top:120px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;color:${color||'#f1c40f'};z-index:80;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.5)`;p.appendChild(e);setTimeout(()=>e.remove(),1100);}
function burst(){const p=document.querySelector('.phone')||document.body;for(let i=0;i<14;i++){const e=document.createElement('div');const cs=['#f1c40f','#2ecc71','#7eb8f7','#fb7185'];e.style.cssText=`position:absolute;top:130px;left:50%;width:8px;height:8px;border-radius:2px;background:${cs[i%4]};z-index:79;pointer-events:none`;p.appendChild(e);const dx=(Math.random()*2-1)*140,dy=-(60+Math.random()*160),rot=Math.random()*360;e.animate([{transform:'translate(-50%,0) rotate(0)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),${dy}px) rotate(${rot}deg)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'});setTimeout(()=>e.remove(),1300);}}

/* ===== שמירה מתמשכת (localStorage עם fallback) ===== */
function persist(){try{localStorage.setItem('sq_state',JSON.stringify({xp:st.xp,srs:st.srs,topicStats:st.topicStats,done:[...st.done],sound:st.sound}));}catch(e){}pushProgress();}
function loadPersist(){try{const d=JSON.parse(localStorage.getItem('sq_state')||'null');if(d){st.xp=d.xp||0;st.srs=d.srs||{};st.topicStats=d.topicStats||{};if(d.done)st.done=new Set(d.done);if(d.sound!==undefined)st.sound=d.sound;}}catch(e){}}

function showPauseHint(){
  if(document.getElementById('pauseHint'))return;
  const qv=document.getElementById('quizVideo');if(!qv)return;
  const h=document.createElement('div');h.id='pauseHint';
  h.style.cssText='margin:6px auto 10px;max-width:340px;background:rgba(241,196,15,.14);border:1px solid #f1c40f;color:#f1c40f;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800;text-align:center;animation:pop .34s ease';
  h.textContent='⏸ בחרו תשובה כדי להמשיך את הסרטון';
  qv.insertAdjacentElement('afterend',h);
}
function hudHtml(){
  const lvl=levelOf(st.xp),inLvl=st.xp%100;
  const hearts=st.heartsOn?`<div style="font-size:13px;letter-spacing:1px;white-space:nowrap">${'❤️'.repeat(Math.max(0,st.hearts))}${'🤍'.repeat(Math.max(0,5-st.hearts))}</div>`:'';
  return `<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
    <div style="background:${C.gold};color:${C.navy};font-size:11px;font-weight:900;padding:4px 9px;border-radius:8px;white-space:nowrap">רמה ${lvl}</div>
    <div style="flex:1;height:8px;background:${C.card};border-radius:5px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#f1c40f,#fb7185);width:${inLvl}%"></div></div>
    <div style="font-size:12px;font-weight:900;color:${C.gold};white-space:nowrap">🔥 ${st.streak}</div>
    ${hearts}
  </div>`;}

/* ===== VOICE ===== */
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('he'));if(v)u.voice=v;speechSynthesis.speak(u);}
function stopSpeak(){if('speechSynthesis'in window)speechSynthesis.cancel();}

/* ===== NAV ===== */
let _examTimer=null;
function go(s){if(s!=='quiz')stopExamTimer();st.screen=s;render();}
function openLesson(id){if(lessonLocked(id)){toast('🔒 השיעור זמין בגרסה המלאה — פתח את הקורס');return;}const l=byId(id);if(l.final){startQuiz(id);return;}st.lessonId=id;st.cardIndex=0;st.vo=false;st.videoEnded=false;stopSpeak();go('lesson');document.getElementById('scroll').scrollTop=0;}
function videoCtaHtml(l){return `<div style="background:${C.card2};border:1px solid ${C.gold};border-radius:14px;padding:14px 16px;margin-bottom:14px;text-align:center">
    <div style="font-size:13.5px;font-weight:900;margin-bottom:9px">🎯 סיימת את הסרטון — הזמן לתרגל</div>
    <button data-act="toquiz" style="width:100%;background:${C.gold};color:${C.navy};border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:900;cursor:pointer">שאלות מבנק השאלות · ${l.title}</button>
  </div>`;}
function beginQuiz(pool,mode,opts){opts=opts||{};st.pool=pool;st.qIndex=0;st.selected=null;st.score=0;st.qvTime=0;st.streak=0;st.gameOver=false;st.mode=mode;st.heartsOn=(mode==='exam'||mode==='review'||mode==='reinforce');st.hearts=5;st.paused=false;st.timeUp=false;st.timed=!!opts.timed;st.secLeft=opts.seconds||0;stopExamTimer();go('quiz');document.getElementById('scroll').scrollTop=0;if(st.timed)startExamTimer();const q0=pool[0];if(q0&&!q0.vid)speak(q0.q);}
function startQuiz(id,mode){const l=byId(id);st.lessonId=id;beginQuiz(quizFor(l),mode||(l&&l.final?'exam':'practice'));}

/* ===== מבחן אקראי / רציף + טיימר + עצירה ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function allQuestions(){const out=[];LESSONS.forEach(l=>{if(l.final)return;(LESSON_Q[l.id]||[]).forEach(q=>out.push(Object.assign({},q,{_lid:l.id})));});return out;}
function dedupeByNum(list){const seen=new Set(),out=[];list.forEach(q=>{if(!seen.has(q.num)){seen.add(q.num);out.push(q);}});return out;}
function examBank(){return dedupeByNum(allQuestions());}
function startTimedExam(){const p=shuffle(examBank()).slice(0,30);if(!p.length){toast('אין שאלות זמינות למבחן');return;}beginQuiz(p,'timed',{timed:true,seconds:50*60});}
function startContinuous(){const p=shuffle(examBank());if(!p.length){toast('אין שאלות זמינות');return;}beginQuiz(p,'continuous');}
function fmtTime(s){s=Math.max(0,s|0);const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}
function startExamTimer(){stopExamTimer();if(!st.timed)return;_examTimer=setInterval(()=>{
  if(st.paused||st.screen!=='quiz')return;
  st.secLeft--;
  const el=document.getElementById('examTimer');
  if(el){el.textContent='⏱ '+fmtTime(st.secLeft);if(st.secLeft<=60)el.style.color=C.bad;}
  if(st.secLeft<=0){stopExamTimer();stopSpeak();st.timeUp=true;st.done.add(st.lessonId);go('results');}
},1000);}
function stopExamTimer(){if(_examTimer){clearInterval(_examTimer);_examTimer=null;}}
function pauseQuiz(){if(st.paused)return;st.paused=true;stopSpeak();const qv=document.getElementById('quizVideo');if(qv)qv.pause();render();}
function resumeQuiz(){st.paused=false;render();}

/* ===== טעימה מודרכת: 30ש׳ שיעור → שאלה → הצעת רישום, אחת לכל נושא ===== */
function tourSteps(){const out=[];LESSONS.forEach(l=>{if(l.final)return;const qs=LESSON_Q[l.id]||[];if(qs.length)out.push({lid:l.id,q:Object.assign({},qs[0],{_lid:l.id})});});return out;}
async function startTour(){
  let s=tourSteps();
  if(!s.length){ // free content not loaded yet (async boot / race) — fetch it now
    toast('טוען טעימה…');
    try{const f=await apiFree();if(f&&f.ok)applyContent(f);}catch(e){}
    s=tourSteps();
  }
  if(!s.length){toast('לא הצלחתי לטעון את הטעימה — בדוק חיבור ונסה שוב');return;}
  st.tour=s;st.tourIdx=0;st.tourPhase='intro';st.selected=null;stopSpeak();go('tour');document.getElementById('scroll').scrollTop=0;
}
function tourToQuestion(){st.tourPhase='q';st.selected=null;const tv=document.getElementById('tourVideo');if(tv)tv.pause();render();document.getElementById('scroll').scrollTop=0;}
const TOUR_PITCH='הירשם לקורס המלא. לא עברת את מבחן התאוריה? קבל את כספך בחזרה.';
function tourAns(i){if(st.selected!==null)return;st.selected=i;render();if(st.sound)speak(TOUR_PITCH);}
function tourNext(){if(st.tourIdx>=st.tour.length-1){go('home');return;}st.tourIdx++;st.tourPhase='intro';st.selected=null;stopSpeak();render();document.getElementById('scroll').scrollTop=0;}
function startReview(){const p=buildReviewPool();if(!p.length){toast('אין שאלות לחזרה כרגע — כל הכבוד! 🎉');return;}beginQuiz(p,'review');}
function startReinforcement(){const p=buildReinforcePool();if(!p.length){toast('עדיין אין מספיק נתונים — תרגל עוד קצת ואבנה לך מבחן חיזוק ממוקד.');return;}beginQuiz(p,'reinforce');}
function prevCard(){if(st.cardIndex>0){st.cardIndex--;st.vo=false;st.videoEnded=false;stopSpeak();render();}}
function nextCard(){const c=buildCards(byId(st.lessonId));if(st.cardIndex<c.length-1){st.cardIndex++;st.vo=false;st.videoEnded=false;stopSpeak();render();}}
function selectAns(i){
  if(st.selected!==null)return;
  const q=st.pool[st.qIndex],ok=(i===q.c);
  st.selected=i;st.fx=ok?'correct':'wrong';
  bumpTopic(q._lid||st.lessonId,ok);
  if(ok){st.score++;st.streak++;const gain=10+(st.streak>=3?5:0)+(st.mode==='review'?2:0);addXp(gain);floaty('+'+gain+' XP','#f1c40f');sfx('correct');srsPromote(q.num);}
  else{st.streak=0;sfx('wrong');srsLapse(q.num);if(st.heartsOn){st.hearts--;floaty('−1 ❤️','#e74c3c');sfx('heart');}}
  persist();stopSpeak();render();
  if(st.heartsOn&&st.hearts<=0){setTimeout(()=>{st.gameOver=true;go('results');},900);}
}
function nextQ(){if(st.qIndex>=st.pool.length-1){stopSpeak();st.done.add(st.lessonId);go('results');}else{st.qIndex++;st.selected=null;st.qvTime=0;render();const q=st.pool[st.qIndex];if(q&&!q.vid)speak(q.q);}}

async function buy(){
  if(!CHECKOUT_OPEN){toast('הרכישה נפתחת בקרוב');return;}
  const buyer=prompt('אימייל לקבלת קוד הגישה והחשבונית:');
  if(!buyer||!/.+@.+/.test(buyer)){toast('צריך אימייל תקין');return;}
  const coupon=(prompt('קוד קופון (יש? הקלד. אין? השאר ריק):')||'').trim();
  toast('פותח תשלום…');
  const ret=location.origin+location.pathname;
  const r=await apiJson('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:buyer,coupon:coupon||undefined,return_url:ret})});
  if(!r||!r.ok){toast(r&&r.reason==='bad-email'?'אימייל לא תקין':'שגיאה בפתיחת התשלום');return;}
  if(r.code){storeCode(r.code);await unlockWithCode(r.code);return;} // 100% קופון → חינם, בלי checkout
  location.href=r.checkout_url;
}

function bindActions(){
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>openLesson(+e.getAttribute('data-open')));
  document.querySelectorAll('[data-ans]').forEach(e=>e.onclick=()=>selectAns(+e.getAttribute('data-ans')));
  document.querySelectorAll('[data-tans]').forEach(e=>e.onclick=()=>tourAns(+e.getAttribute('data-tans')));
  document.querySelectorAll('[data-act]').forEach(e=>{
    const a=e.getAttribute('data-act');
    e.onclick=()=>{
      if(a==='start'){if(st.owned)go('home');else startTour();}
      else if(a==='tourq')tourToQuestion();
      else if(a==='tournext')tourNext();
      else if(a==='home'){stopSpeak();go('home');}
      else if(a==='prev')prevCard();
      else if(a==='next')nextCard();
      else if(a==='vo')toggleVo();
      else if(a==='toquiz')startQuiz(st.lessonId);
      else if(a==='nextq')nextQ();
      else if(a==='quit'){stopExamTimer();stopSpeak();const qv=document.getElementById('quizVideo');if(qv)qv.pause();go('home');}
      else if(a==='pause')pauseQuiz();
      else if(a==='resume')resumeQuiz();
      else if(a==='skip')nextQ();
      else if(a==='retry'){if(st.mode==='review')startReview();else if(st.mode==='reinforce')startReinforcement();else if(st.mode==='timed')startTimedExam();else if(st.mode==='continuous')startContinuous();else startQuiz(st.lessonId,st.mode);}
      else if(a==='review')startReview();
      else if(a==='reinforce')startReinforcement();
      else if(a==='timedexam')startTimedExam();
      else if(a==='continuous')startContinuous();
      else if(a==='practice')go('practice');
      else if(a==='profile'){stopSpeak();go('profile');}
      else if(a==='sound'){st.sound=!st.sound;persist();toast(st.sound?'🔊 צלילים פעילים':'🔇 צלילים כבויים');render();}
      else if(a==='manage')toast('ניהול מנוי — יחובר למערכת החיוב (Tranzila).');
      else if(a==='logout')logout();
      else if(a==='havecode')promptCode();
      else if(a==='buy')buy();
    };
  });
  const lv=document.getElementById('lessonVideo');
  if(lv){
    lv.onended=()=>{st.videoEnded=true;render();const h=document.getElementById('videoCta');if(h)h.scrollIntoView({behavior:'smooth',block:'center'});};
    if(!st.videoEnded&&st.cardIndex===0&&lv.play)lv.play().catch(()=>{});
  }
  const tv=document.getElementById('tourVideo');
  if(tv){
    stopSpeak();
    let advanced=false;
    const toQ=()=>{if(advanced||st.tourPhase!=='intro')return;advanced=true;try{tv.pause();}catch(e){}tourToQuestion();};
    tv.ontimeupdate=()=>{if(tv.currentTime>=30)toQ();}; // 30s taster → jump to the question
    tv.onended=toQ;                                     // shorter clip → same
    if(tv.play)tv.play().catch(()=>{});
  }
  const qv=document.getElementById('quizVideo');
  if(qv){
    stopSpeak();
    qv.ontimeupdate=()=>{
      st.qvTime=qv.currentTime;
      const q=st.pool[st.qIndex];
      if(q&&q.p&&st.selected===null&&qv.duration&&isFinite(qv.duration)&&qv.currentTime>=q.p*qv.duration){qv.pause();showPauseHint();}
    };
    if(st.qvTime>0.1){const seek=()=>{try{qv.currentTime=st.qvTime;}catch(e){}};if(qv.readyState>=1)seek();else qv.onloadedmetadata=seek;}
    if(qv.play)qv.play().catch(()=>{});
  }
}

/* toast */
let tT;function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a2f5e;border:1px solid #2a4a8a;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:99;max-width:340px;text-align:center;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(tT);tT=setTimeout(()=>t.style.opacity='0',2600);}

if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}
loadPersist();
render();
bootstrap();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
