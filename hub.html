<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub · ניהול מדריכים · SkipperQuiz</title>
<style>
  :root{--navy:#0a1428;--card:#132447;--card2:#0f1d3a;--bd:#2a4a8a;--gold:#f1c40f;--blue:#7eb8f7;--mut:#9db4dc;--ok:#2ecc71;--bad:#e74c3c;--txt:#eaf1ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--txt);font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12.5px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--blue)}
  label{display:block;font-size:11.5px;color:var(--mut);margin:0 0 4px}
  input{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;color:var(--txt);font-size:13.5px}
  input:focus{outline:none;border-color:var(--blue)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .field{margin-bottom:10px}
  button{background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:800;cursor:pointer}
  button.ghost{background:transparent;color:var(--blue);border:1px solid var(--bd);font-weight:700}
  button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:700;padding:5px 10px;font-size:11.5px}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px}
  .ok{color:var(--ok)} .err{color:var(--bad)}
  .codebox{background:var(--card2);border:1px dashed var(--gold);border-radius:10px;padding:12px;margin-top:10px;font-family:monospace;font-size:16px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:right;padding:8px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
  th{color:var(--mut);font-weight:700;font-size:11px;white-space:nowrap}
  td.code{font-family:monospace;color:var(--gold);white-space:nowrap}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:1px 8px;font-size:11px}
  .revoked{opacity:.5}
  .hist{background:var(--card2);border-radius:8px;padding:8px 10px;margin-top:4px;font-size:11.5px;color:var(--mut)}
  .row-actions{display:flex;gap:6px;align-items:center;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hub · ניהול מדריכים</h1>
  <div class="sub">הנפקת קודי גישה למדריכים ומעקב שימוש. מקומי בלבד. הטוקן נשמר בדפדפן הזה בלבד.</div>

  <div class="card">
    <h2>הגדרות</h2>
    <div class="grid">
      <div class="field"><label>כתובת API</label><input id="api" placeholder="https://api.alargov.com"></div>
      <div class="field"><label>ADMIN_TOKEN</label><input id="token" type="password" placeholder="הדבק את הטוקן"></div>
    </div>
    <button class="ghost" onclick="saveCfg()">שמור</button>
    <span id="cfgMsg" class="msg"></span>
  </div>

  <div class="card">
    <h2>הנפקת קוד למדריך חדש</h2>
    <div class="row3">
      <div class="field"><label>שם מלא</label><input id="name" placeholder="שם המדריך"></div>
      <div class="field"><label>בית ספר / מקום לימוד</label><input id="school" placeholder="בית הספר"></div>
      <div class="field"><label>טלפון</label><input id="phone" placeholder="05x-xxxxxxx"></div>
    </div>
    <div class="field"><label>דוא"ל</label><input id="email" placeholder="instructor@example.com"></div>
    <button onclick="mint()" id="mintBtn">הנפק קוד</button>
    <span class="sub" style="margin-right:10px">כל קוד = מכשיר אחד בלבד</span>
    <div id="mintMsg" class="msg"></div>
    <div id="codeOut"></div>
  </div>

  <div class="card">
    <h2>מדריכים ושימוש <button class="ghost" style="float:left;padding:5px 12px;font-size:12px" onclick="load()">רענן</button></h2>
    <div id="tableWrap"><div class="sub">שמור טוקן ולחץ רענן.</div></div>
  </div>

  <div class="card">
    <h2>רוכשים ונרשמים <button class="ghost" style="float:left;padding:5px 12px;font-size:12px" onclick="loadBuyers()">רענן</button></h2>
    <div id="buyersWrap"><div class="sub">מי שילם, מי התחיל תשלום ולא סיים, ומי השאיר דוא"ל לטעימה בלבד.</div></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const api = () => ($('api').value || 'https://api.alargov.com').replace(/\/$/, '');
  const tok = () => $('token').value.trim();

  function loadCfg(){ try{ $('api').value=localStorage.getItem('hub_api')||'https://api.alargov.com'; $('token').value=localStorage.getItem('hub_tok')||''; }catch(e){} }
  function saveCfg(){ try{ localStorage.setItem('hub_api',api()); localStorage.setItem('hub_tok',tok()); $('cfgMsg').textContent='נשמר'; $('cfgMsg').className='msg ok'; setTimeout(()=>$('cfgMsg').textContent='',1500);}catch(e){} }

  async function apiCall(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({'x-admin': tok()}, opts.headers||{});
    const r = await fetch(api()+path, opts);
    return r.json().catch(()=>({ok:false,reason:'bad-json'}));
  }

  function fmt(ts){ if(!ts) return '—'; try{ return new Date(ts).toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ts; } }

  async function mint(){
    const email=$('email').value.trim();
    if(!tok()){ msg('mintMsg','חסר ADMIN_TOKEN (שמור בהגדרות)','err'); return; }
    if(!/.+@.+/.test(email)){ msg('mintMsg','דוא"ל לא תקין','err'); return; }
    $('mintBtn').disabled=true; msg('mintMsg','מנפיק…','');
    const body={ name:$('name').value.trim(), school:$('school').value.trim(), email, phone:$('phone').value.trim() };
    try{
      const r=await apiCall('/api/admin/promo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r&&r.ok&&r.codes&&r.codes[0]){
        const code=r.codes[0].code;
        $('codeOut').innerHTML='<div class="codebox"><span>'+code+'</span><button class="ghost" style="padding:5px 12px" onclick="copy(\''+code+'\')">העתק</button></div>';
        msg('mintMsg','נוצר קוד ל'+(body.name||email),'ok');
        ['name','school','phone','email'].forEach(id=>$(id).value='');
        load();
      } else { msg('mintMsg','שגיאה: '+((r&&r.reason)||(r&&r.error)||'לא ידוע'),'err'); }
    }catch(e){ msg('mintMsg','אין חיבור ל-API (בדוק כתובת/CORS): '+e.message,'err'); }
    $('mintBtn').disabled=false;
  }

  function copy(t){ navigator.clipboard.writeText(t).catch(()=>{}); }
  function msg(id,t,cls){ const e=$(id); e.textContent=t; e.className='msg '+(cls||''); }

  async function revoke(code){
    if(!confirm('לבטל את הקוד '+code+'? הגישה תיחסם מיד.')) return;
    const r=await apiCall('/api/admin/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    if(r&&r.ok) load(); else alert('שגיאה בביטול');
  }

  function toggleHist(code){ const el=$('h_'+code); if(el) el.style.display = el.style.display==='none'?'block':'none'; }

  async function load(){
    if(!tok()){ $('tableWrap').innerHTML='<div class="sub err">חסר ADMIN_TOKEN.</div>'; return; }
    $('tableWrap').innerHTML='<div class="sub">טוען…</div>';
    let r;
    try{ r=await apiCall('/api/admin/instructors'); }
    catch(e){ $('tableWrap').innerHTML='<div class="sub err">אין חיבור ל-API: '+e.message+'</div>'; return; }
    if(!(r&&r.ok)){ $('tableWrap').innerHTML='<div class="sub err">שגיאה: '+((r&&r.reason)||'—')+' (טוקן שגוי?)</div>'; return; }
    const rows=r.instructors||[];
    if(!rows.length){ $('tableWrap').innerHTML='<div class="sub">עדיין אין מדריכים.</div>'; return; }
    let html='<table><thead><tr><th>שם</th><th>בית ספר</th><th>דוא"ל</th><th>טלפון</th><th>קוד</th><th>מכשירים</th><th>שימושים</th><th>אחרון</th><th></th></tr></thead><tbody>';
    for(const i of rows){
      const cls=i.revoked?' class="revoked"':'';
      html+='<tr'+cls+'>'
        +'<td>'+(esc(i.name)||'—')+'</td>'
        +'<td>'+(esc(i.school)||'—')+'</td>'
        +'<td>'+(esc(i.email)||'—')+'</td>'
        +'<td>'+(esc(i.phone)||'—')+'</td>'
        +'<td class="code">'+i.code+(i.revoked?' <span class="pill">מבוטל</span>':'')+'</td>'
        +'<td>'+(i.devices||0)+'/'+(i.device_limit||1)+'</td>'
        +'<td><b>'+(i.visits||0)+'</b></td>'
        +'<td>'+fmt(i.last_seen)+'</td>'
        +'<td class="row-actions">'
          +'<button class="ghost" style="padding:4px 9px;font-size:11px" onclick="toggleHist(\''+i.code+'\')">זמנים</button>'
          +(i.revoked?'':'<button class="danger" onclick="revoke(\''+i.code+'\')">בטל</button>')
        +'</td></tr>';
      const rec=(i.recent||[]);
      html+='<tr id="h_'+i.code+'" style="display:none"><td colspan="9"><div class="hist">'
        +(rec.length? rec.map(fmt).join(' · ') : 'אין ביקורים עדיין')
        +'</div></td></tr>';
    }
    html+='</tbody></table>';
    $('tableWrap').innerHTML=html;
  }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function moneyTable(title, rows, cols){
    if(!rows.length) return '<div class="sub" style="margin:6px 0 14px">'+title+': אין רשומות.</div>';
    let h='<div style="margin:10px 0 4px;color:var(--blue);font-weight:700;font-size:12.5px">'+title+' ('+rows.length+')</div>';
    h+='<table><thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>';
    for(const r of rows){ h+='<tr>'+cols.map(c=>'<td'+(c[2]||'')+'>'+c[1](r)+'</td>').join('')+'</tr>'; }
    return h+'</tbody></table>';
  }

  async function loadBuyers(){
    if(!tok()){ $('buyersWrap').innerHTML='<div class="sub err">חסר ADMIN_TOKEN.</div>'; return; }
    $('buyersWrap').innerHTML='<div class="sub">טוען…</div>';
    let r;
    try{ r=await apiCall('/api/admin/buyers'); }
    catch(e){ $('buyersWrap').innerHTML='<div class="sub err">אין חיבור ל-API: '+e.message+'</div>'; return; }
    if(!(r&&r.ok)){ $('buyersWrap').innerHTML='<div class="sub err">שגיאה: '+((r&&r.reason)||'—')+' (טוקן שגוי?)</div>'; return; }
    const money=x=>x==null?'—':'₪'+Number(x);
    let html='';
    html+=moneyTable('שילמו', r.paid||[], [
      ['דוא"ל', x=>esc(x.email)||'—'],
      ['סכום', x=>money(x.amount_ils)],
      ['קופון', x=>esc(x.coupon_code)||'—'],
      ['קוד', x=>x.code?'<span style="font-family:monospace;color:var(--gold)">'+x.code+'</span>':'—', ' class="code"'],
      ['תאריך', x=>fmt(x.created_at)],
    ]);
    html+=moneyTable('התחילו תשלום ולא סיימו', r.pending||[], [
      ['דוא"ל', x=>esc(x.email)||'—'],
      ['סכום', x=>money(x.amount_ils)],
      ['תאריך', x=>fmt(x.created_at)],
    ]);
    html+=moneyTable('דוא"ל לטעימה בלבד (לא רכשו)', r.leads||[], [
      ['דוא"ל', x=>esc(x.email)||'—'],
      ['מקור', x=>esc(x.source)||'—'],
      ['תאריך', x=>fmt(x.created_at)],
    ]);
    $('buyersWrap').innerHTML=html;
  }

  loadCfg();
  if(tok()){ load(); loadBuyers(); }
</script>
</body>
</html>
