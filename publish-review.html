<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>אישור פרסום — SkipperQuiz</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Heebo', Arial, sans-serif; background: #0c1a3a; color: #fff; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; max-width: 1100px; }
  .col { flex: 1; min-width: 320px; }
  video { width: 100%; max-width: 380px; border-radius: 10px; background: #000; display: block; }
  label { display: block; font-size: 13px; color: #7eb8f7; margin: 14px 0 4px; font-weight: 700; }
  input[type=text], input[type=number] {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #2a4a8a;
    background: #1a2f5e; color: #fff; font-size: 14px;
  }
  textarea {
    width: 100%; min-height: 300px; padding: 10px; border-radius: 6px; border: 1px solid #2a4a8a;
    background: #1a2f5e; color: #fff; font-size: 14px; line-height: 1.5; font-family: inherit; resize: vertical;
  }
  .meta { font-size: 13px; color: #9db8e8; margin-top: 6px; }
  button {
    margin-top: 16px; padding: 10px 22px; border: none; border-radius: 8px; font-size: 15px;
    font-weight: 700; cursor: pointer;
  }
  #loadBtn { background: #2a4a8a; color: #fff; }
  #publishBtn { background: #2ecc71; color: #0d3d2a; }
  #publishBtn:disabled { background: #2a4a8a; color: #9db8e8; cursor: not-allowed; }
  #status { margin-top: 16px; font-size: 14px; white-space: pre-wrap; }
  .ok { color: #2ecc71; }
  .err { color: #ff6b6b; }
  .topbar { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px; }
  .topbar input { width: 100px; }
  #groups { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto;
    background: #1a2f5e; border: 1px solid #2a4a8a; border-radius: 6px; padding: 8px; margin-top: 4px; }
  .group-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; border-radius: 4px; }
  .group-row:hover { background: #223a6e; }
  .group-row label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #fff; font-weight: 400; margin: 0; cursor: pointer; }
  .group-row button { margin: 0; padding: 2px 8px; font-size: 13px; background: #2a4a8a; border-radius: 5px; }
  #groupsBtn { background: #2a4a8a; }
</style>
</head>
<body>
<h1>אישור פרסום Reel לפני הפצה</h1>

<div class="topbar">
  <div><label>מספר שאלה</label><input type="number" id="num" placeholder="1056"></div>
  <div><label>רשיון</label><input type="number" id="license" value="11"></div>
  <button id="loadBtn" onclick="load()">טען</button>
</div>

<div class="row" id="content" style="display:none">
  <div class="col">
    <video id="video" controls></video>
    <div class="meta" id="meta"></div>
  </div>
  <div class="col">
    <label>כותרת (title)</label>
    <input type="text" id="title">
    <label>טקסט הפוסט (caption)</label>
    <textarea id="caption"></textarea>
    <button id="publishBtn" onclick="publish()">אשר ופרסם עכשיו</button>
    <div id="status"></div>

    <label>הפצה לקבוצות פייסבוק (חצי-אוטומטי — מטא לא מאפשרת פרסום אוטומטי לקבוצות; כל כפתור מעתיק את הקפשן ופותח את הקבוצה, אתה מדביק ומפרסם)</label>
    <div id="groups"></div>
    <button id="groupsBtn" onclick="openGroups()">📋 העתק קפשן ופתח קבוצות מסומנות</button>
    <div id="groupsStatus" class="meta"></div>
  </div>
</div>

<script>
let current = null;
let groupsData = [];

// Meta doesn't allow automated posting into Facebook Groups (no such app in
// Make.com either — publish_to_groups was pulled from the Graph API years ago),
// so this is a manual-click assist: copy the caption, open the group's feed
// (composer is right there), you paste and hit post yourself.
async function loadGroups() {
  const res = await fetch('/tools/facebook-groups.json');
  groupsData = await res.json();
  document.getElementById('groups').innerHTML = groupsData.map((g, i) => `
    <div class="group-row">
      <label><input type="checkbox" id="grp${i}" ${g.default ? 'checked' : ''}> ${g.name}</label>
      <button type="button" onclick="openOneGroup(${i})" title="העתק קפשן ופתח קבוצה זו">🔗 פתח</button>
    </div>
  `).join('');
}

function groupUrl(g) {
  return `https://www.facebook.com/groups/${g.id}/`;
}

// Clipboard write needs a secure origin + permission; can silently fail (blocked
// permission, non-HTTPS localhost quirks). Never let that stop the tabs from
// opening — just tell the user to copy from the textarea manually instead.
async function copyCaption() {
  try {
    await navigator.clipboard.writeText(document.getElementById('caption').value);
    return true;
  } catch (e) {
    return false;
  }
}

// מוריד את קובץ הוידאו עצמו (לא קישור) לתיקיית ההורדות, כדי שאפשר יהיה
// לגרור אותו ישירות לתיבת הפוסט בקבוצה. עדיפות ל-remoteVideoUrl (Cloudinary) —
// זה המקור הפרסום-אמיתי; videoPath המקומי (output/videos/) יכול להיות ישן אם
// השאלה רונדרה-מחדש ב-POST ישיר לשרת (שמעדכן רק את הענן, לא את הקובץ המקומי),
// מה שגרם להורדת וידאו גנרי/מיושן במקום הגרסה הנכונה שכבר בענן.
// remoteVideoUrl הוא cross-origin: לרוב הדפדפן פשוט יפתח אותו בטאב חדש במקום
// להוריד — עדיין נותן גישה מהירה לכפתור השמירה של הנגן.
function downloadVideo() {
  if (!current) return;
  const src = current.remoteVideoUrl || current.videoPath;
  if (!src) return;
  // שם קובץ ייחודי לגרסה (מזהה Cloudinary או timestamp) — אחרת דפדפן שכבר
  // הוריד skipperquiz-qN.mp4 פעם אחת (מרינדור ישן) משאיר את הקובץ הישן על
  // הכונן עם אותו שם, וגרירה חוזרת מביאה את הגרסה הגנרית/מיושנת בטעות.
  const versionTag = current.remoteVideoUrl
    ? current.remoteVideoUrl.split('/').pop().replace(/\.mp4$/, '')
    : Date.now();
  const a = document.createElement('a');
  a.href = src;
  a.download = `skipperquiz-q${current.num}-${versionTag}.mp4`;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// מתעד רק "נפתח" (לחיצה + טאב) — לא הוכחה שהפוסט אכן פורסם בקבוצה, מטא לא
// חושפת API לבדוק את זה. monitor.html מציג את זה בתור "נפתח", לא "פורסם".
async function logGroupOpen(groups) {
  if (!current) return;
  try {
    await fetch('/api/group-log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ num: current.num, groups: groups.map(g => ({ id: g.id, name: g.name })) })
    });
  } catch (e) { /* לא חוסם את זרימת הפרסום אם התיעוד נכשל */ }
}

async function openOneGroup(i) {
  const ok = await copyCaption();
  downloadVideo();
  window.open(groupUrl(groupsData[i]), '_blank');
  logGroupOpen([groupsData[i]]);
  document.getElementById('groupsStatus').innerHTML = ok
    ? `הקפשן הועתק, הוידאו יורד — הדבק את הטקסט וגרור את קובץ ה-mp4 מההורדות לפוסט ב-${groupsData[i].name}`
    : `<span class="err">ההעתקה האוטומטית נחסמה — העתק ידנית מתיבת הטקסט למעלה, ואז הדבק ב-${groupsData[i].name}</span>`;
}

async function openGroups() {
  const checked = groupsData.filter((g, i) => document.getElementById('grp' + i).checked);
  if (!checked.length) {
    document.getElementById('groupsStatus').innerHTML = '<span class="err">לא נבחרה אף קבוצה</span>';
    return;
  }
  const ok = await copyCaption();
  downloadVideo();
  for (const g of checked) window.open(groupUrl(g), '_blank');
  logGroupOpen(checked);
  document.getElementById('groupsStatus').innerHTML = ok
    ? `הקפשן הועתק ללוח, הוידאו יורד, נפתחו ${checked.length} קבוצות — בכל אחת: הדבק טקסט וגרור את קובץ ה-mp4 מההורדות (אם חלק לא נפתחו, ייתכן שהדפדפן חסם popups — אשר אותם ונסה שוב).`
    : `<span class="err">נפתחו ${checked.length} קבוצות אבל ההעתקה האוטומטית נחסמה — העתק ידנית מתיבת הטקסט למעלה.</span>`;
}
loadGroups();

// תמיכה ב-?num=1056&license=11 בכתובת — כך monitor.html יכול לקשר ישירות
// לתצוגה המלאה (וידאו+קפשן+קבוצות) של שאלה שכבר פורסמה, במקום לפתוח את קובץ
// הוידאו הגולמי.
// ?published=1 מגיע מ-monitor.html — שאלה שכבר פורסמה לפי publish-log, לא
// טיוטה. חוסם את כפתור הפרסום כדי שצפייה חוזרת לא תרים בטעות פרסום כפול.
let viewingAlreadyPublished = false;

(function loadFromQueryString() {
  const params = new URLSearchParams(location.search);
  const num = params.get('num');
  if (!num) return;
  document.getElementById('num').value = num;
  document.getElementById('license').value = params.get('license') || '11';
  viewingAlreadyPublished = params.get('published') === '1';
  load();
})();

async function load() {
  const num = document.getElementById('num').value.trim();
  const license = document.getElementById('license').value.trim() || '11';
  if (!num) return;
  document.getElementById('status').textContent = '';
  const res = await fetch(`/api/publish-preview?num=${encodeURIComponent(num)}&license=${encodeURIComponent(license)}`);
  const data = await res.json();
  if (data.error) {
    document.getElementById('content').style.display = 'none';
    document.getElementById('status').innerHTML = `<span class="err">${data.error}</span>`;
    return;
  }
  current = data;
  document.getElementById('content').style.display = 'flex';
  document.getElementById('video').src = data.rendered ? data.videoPath : data.remoteVideoUrl;
  document.getElementById('title').value = data.title;
  document.getElementById('caption').value = data.caption;
  document.getElementById('meta').textContent =
    `נושא: ${data.topic} | תשובה: ${data.answer} | מקור וידאו: ${data.rendered ? 'רינדור מקומי' : (data.remoteVideoUrl ? 'Cloudinary (כבר פורסם)' : 'אין וידאו — הרץ קודם make_question_video')}`;
  document.getElementById('publishBtn').disabled = viewingAlreadyPublished || (!data.rendered && !data.remoteVideoUrl);
  document.getElementById('status').innerHTML = viewingAlreadyPublished
    ? '<span class="meta">שאלה זו כבר פורסמה — כפתור הפרסום נחסם כדי למנוע פרסום כפול. אפשר עדיין להפיץ לקבוצות למטה.</span>'
    : '';
}

async function publish() {
  if (!current) return;
  if (!confirm(`לפרסם את שאלה ${current.num} עכשיו? זה יזרים בפועל ל-YouTube+Facebook+Instagram דרך Make.com.`)) return;
  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  document.getElementById('status').textContent = 'מעלה ל-R2 ומפרסם...';
  try {
    const res = await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        num: current.num,
        license: current.license,
        title: document.getElementById('title').value,
        caption: document.getElementById('caption').value
      })
    });
    const data = await res.json();
    if (data.status === 'published') {
      document.getElementById('status').innerHTML = `<span class="ok">פורסם. videoUrl: ${data.payload.videoUrl}</span>`;
    } else {
      document.getElementById('status').innerHTML = `<span class="err">${data.message}</span>`;
      btn.disabled = false;
    }
  } catch (e) {
    document.getElementById('status').innerHTML = `<span class="err">${e.message}</span>`;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
