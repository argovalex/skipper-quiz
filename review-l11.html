const grid = document.getElementById('grid');
const sub = document.getElementById('sub');
const g = ROWS.filter(r=>r.generic).length;
sub.textContent = ROWS.length + ' שאלות, ' + g + ' מהן עם רקע גנרי של ניווט, ' +
                  ROWS.filter(r=>r.media).length + ' עם מפה ייעודית';

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function render(filter){
  const list = ROWS.filter(r =>
    filter==='all' ? true :
    filter==='generic' ? r.generic :
    filter==='map' ? !!r.media : !r.generic);
  document.getElementById('count').textContent = list.length + ' מוצגות';
  grid.innerHTML = list.map(r => `
    <div class="card ${r.generic?'generic':''}">
      <div class="head">
        <span class="num">#${r.num}</span>
        <span class="tag">${esc(r.topic)}</span>
        ${r.generic?'<span class="tag warn">רקע גנרי</span>':''}
        ${r.media?'<span class="tag map">מפה</span>':''}
      </div>
      <div class="qt">${esc(r.q)}</div>
      ${r.video
        ? `<video src="${r.video}" controls preload="metadata" playsinline></video>
           <a class="dl" href="${r.video}" target="_blank" rel="noopener">פתח את הסרטון בלשונית חדשה</a>`
        : '<div class="none">אין סרטון</div>'}
    </div>`).join('');
}

document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if(!b) return;
  document.querySelectorAll('#bar button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  render(b.dataset.f);
});
render('all');
</script>
